<title>プリンセスぬりえ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "Hiragino Maru Gothic ProN","Rounded Mplus 1c","Segoe UI",sans-serif;
    background:
      radial-gradient(circle at 10% 10%, rgba(255,255,255,0.6) 0 6px, transparent 7px),
      radial-gradient(circle at 80% 20%, rgba(255,255,255,0.6) 0 5px, transparent 6px),
      radial-gradient(circle at 30% 80%, rgba(255,255,255,0.5) 0 4px, transparent 5px),
      radial-gradient(circle at 90% 70%, rgba(255,255,255,0.5) 0 5px, transparent 6px),
      radial-gradient(circle at 60% 40%, rgba(255,255,255,0.5) 0 4px, transparent 5px),
      linear-gradient(160deg, #ffe1f0 0%, #f4c9ff 45%, #c7e0ff 100%);
    background-attachment: fixed;
    min-height: 100%;
    overflow-x: hidden;
  }
  .app { max-width: 720px; margin: 0 auto; padding: 10px 10px 24px; }
  header { display:flex; align-items:center; justify-content:space-between; padding: 6px 4px 10px; }
  h1 { font-size: 20px; margin:0; color:#8e2a6b; text-shadow: 0 1px 0 #fff; letter-spacing: 1px; }
  .icon-btn {
    width: 46px; height:46px; border-radius: 50%; border:none;
    background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.18);
    font-size: 22px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .icon-btn:active { transform: scale(0.9); }
  .header-btns { display:flex; gap:8px; }

  .tabs { display:flex; gap:8px; justify-content:center; margin: 4px 0 12px; flex-wrap: wrap; }
  .tab {
    width: 58px; height:58px; border-radius: 50%; border: 3px solid transparent;
    background: #fff; font-size: 27px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  }
  .tab.active { border-color:#ff5fa2; transform: scale(1.12); box-shadow: 0 4px 12px rgba(255,95,162,0.5); }

  .stage-card {
    background: #fffdf9; border-radius: 26px; box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    padding: 10px; position: relative; overflow:hidden;
    max-width: 560px; margin: 0 auto;
  }
  .page { display:none; position: relative; }
  .page.active { display:block; }
  .svg-wrap svg { width:100%; height:auto; display:block; touch-action: manipulation; }
  .svg-wrap .colorable { cursor:pointer; transition: fill .12s ease; }
  .svg-wrap .colorable.pop { animation: popFlash .22s ease; }
  @keyframes popFlash { 0%{ filter:brightness(1); } 50%{ filter:brightness(1.55) saturate(1.3); } 100%{ filter:brightness(1); } }

  .celebrate-overlay {
    position:absolute; inset:0; background: rgba(255,255,255,0.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; z-index: 20; border-radius: 20px; padding: 20px;
    animation: fadeIn .35s ease;
  }
  .celebrate-overlay[hidden] { display:none; }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  .celebrate-emoji { font-size: 64px; animation: bounce .6s ease infinite alternate; }
  @keyframes bounce { from{ transform:translateY(0);} to{ transform:translateY(-14px);} }
  .celebrate-text { font-size: 26px; color:#e0499a; font-weight:bold; margin-top:6px; }
  .celebrate-sub { font-size: 15px; color:#a45; margin-top:6px; }
  .confetti-piece { position:absolute; top:-16px; width:10px; height:16px; opacity:0.95; border-radius:2px; }

  .palette {
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center;
    padding: 16px 6px 4px;
  }
  .swatch {
    width: 46px; height:46px; border-radius:50%; border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25); cursor:pointer; flex-shrink:0;
  }
  .swatch.selected { border-color:#333; transform: scale(1.18); box-shadow: 0 0 0 3px #ffd700; }

  .nav-row { display:flex; align-items:center; justify-content:center; gap:16px; margin-top: 10px; }
  .nav-arrow {
    width:44px; height:44px; border-radius:50%; border:none; background:#fff;
    box-shadow:0 3px 8px rgba(0,0,0,0.18); font-size:22px; cursor:pointer;
  }
  .nav-arrow:active { transform: scale(0.9); }
  .dots { display:flex; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#e6bede; }
  .dot.active { background:#ff5fa2; width:22px; border-radius:6px; }
</style>

<script>
(function(){
  var colors = [
    '#ff6fa5','#ff1493','#ffc0e0','#ff4757','#ffa502','#feca57','#ffd700',
    '#7bed9f','#2ed573','#26d0ce','#70a1ff','#1e90ff','#a55eea','#d6a4f5',
    '#a0522d','#2f3542','#ffffff','#c8d6e5'
  ];
  var icons = ['👑','🏰','🎃','💎','🦄','🧜‍♀️','👠','🫖','🌸','🦋'];
  var currentColor = colors[0];
  var currentIndex = 0;
  var muted = false;
  var audioCtx = null;

  var pages = Array.prototype.slice.call(document.querySelectorAll('.page'));
  var tabsEl = document.getElementById('tabs');
  var dotsEl = document.getElementById('dots');
  var paletteEl = document.getElementById('palette');

  // build tabs
  icons.forEach(function(icon, i){
    var b = document.createElement('button');
    b.className = 'tab' + (i===0 ? ' active' : '');
    b.textContent = icon;
    b.addEventListener('click', function(){ showPage(i); });
    tabsEl.appendChild(b);
  });

  // build dots
  icons.forEach(function(_, i){
    var d = document.createElement('div');
    d.className = 'dot' + (i===0 ? ' active' : '');
    dotsEl.appendChild(d);
  });

  // build palette
  colors.forEach(function(c, i){
    var s = document.createElement('div');
    s.className = 'swatch' + (i===0 ? ' selected' : '');
    s.style.background = c;
    s.addEventListener('click', function(){
      document.querySelectorAll('.swatch').forEach(function(el){ el.classList.remove('selected'); });
      s.classList.add('selected');
      currentColor = c;
    });
    paletteEl.appendChild(s);
  });

  function showPage(idx){
    currentIndex = idx;
    pages.forEach(function(p, i){ p.classList.toggle('active', i === idx); });
    document.querySelectorAll('.tab').forEach(function(t, i){ t.classList.toggle('active', i === idx); });
    document.querySelectorAll('.dot').forEach(function(d, i){ d.classList.toggle('active', i === idx); });
  }

  document.getElementById('prevBtn').addEventListener('click', function(){
    showPage((currentIndex - 1 + pages.length) % pages.length);
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    showPage((currentIndex + 1) % pages.length);
  });

  document.getElementById('muteBtn').addEventListener('click', function(e){
    muted = !muted;
    e.currentTarget.textContent = muted ? '🔇' : '🔊';
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    var page = pages[currentIndex];
    page.querySelectorAll('.colorable').forEach(function(el){ el.setAttribute('fill', '#ffffff'); });
    var overlay = page.querySelector('.celebrate-overlay');
    overlay.hidden = true;
    overlay.innerHTML = '';
    page.dataset.celebrated = '0';
  });

  function ensureAudio(){
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
  }
  function playTone(freq, dur, delay, type){
    if (muted) return;
    ensureAudio();
    if (!audioCtx) return;
    delay = delay || 0;
    var t0 = audioCtx.currentTime + delay;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }
  function playPop(){ playTone(600 + Math.random()*250, 0.12); }
  function playSuccess(){
    [523,659,784,1046].forEach(function(f, i){ playTone(f, 0.28, i*0.15); });
  }

  function isPageComplete(pageEl){
    var required = pageEl.querySelectorAll('.colorable:not(.deco)');
    for (var i=0; i<required.length; i++){
      var f = (required[i].getAttribute('fill') || '').toLowerCase();
      if (!f || f === '#ffffff' || f === '#fff' || f === 'white') return false;
    }
    return true;
  }

  var confettiColors = ['#ff6fa5','#ffd700','#70a1ff','#7bed9f','#a55eea','#ff4757','#feca57'];
  function celebrate(pageEl){
    if (pageEl.dataset.celebrated === '1') return;
    pageEl.dataset.celebrated = '1';
    playSuccess();
    var overlay = pageEl.querySelector('.celebrate-overlay');
    overlay.innerHTML =
      '<div class="celebrate-emoji">🎉</div>' +
      '<div class="celebrate-text">できたね!✨</div>' +
      '<div class="celebrate-sub">とってもすてき!(タップでとじる)</div>';
    for (var i=0; i<28; i++){
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = (Math.random()*100) + '%';
      piece.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
      var dur = 1.2 + Math.random()*1.3;
      var delay = Math.random()*0.6;
      piece.style.animation = 'confettiFall ' + dur + 's linear ' + delay + 's forwards';
      overlay.appendChild(piece);
    }
    overlay.hidden = false;
    overlay.addEventListener('click', function closeIt(){
      overlay.hidden = true;
      overlay.removeEventListener('click', closeIt);
    });
  }

  // confetti keyframes injected via JS (needs page height)
  var styleEl = document.createElement('style');
  styleEl.textContent = '@keyframes confettiFall { to { transform: translateY(420px) rotate(360deg); opacity: 0.25; } }';
  document.head.appendChild(styleEl);

  document.querySelectorAll('.colorable').forEach(function(el){
    el.addEventListener('click', function(e){
      el.setAttribute('fill', currentColor);
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
      playPop();
      var pageEl = el.closest('.page');
      if (isPageComplete(pageEl)) celebrate(pageEl);
    });
  });

})();
</script>
