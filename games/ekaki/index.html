<!DOCTYPE html>
<html lang="ja">

<meta charset="UTF-8">

<meta name="mobile-web-app-capable" content="yes">
<title>おえかきレッスン</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-touch-callout: none; }
  html, body {
    margin: 0; padding: 0; min-height:100%;
    font-family: "Hiragino Maru Gothic ProN","Rounded Mplus 1c","Segoe UI",sans-serif;
    background: linear-gradient(160deg, #fff4d6 0%, #ffe1e1 45%, #e1f0ff 100%);
    background-attachment: fixed;
    color:#4a3a2a;
  }
  button { font-family:inherit; cursor:pointer; }
  h1,h2 { margin:0; }
  .screen { display:none; min-height:100vh; }
  .app { max-width: 560px; margin:0 auto; padding: 14px 12px 30px; }

  header { display:flex; align-items:center; justify-content:space-between; padding:6px 4px 10px; }
  h1.title { font-size:18px; color:#d2691e; text-shadow:0 1px 0 #fff; }
  .icon-btn {
    width:44px; height:44px; border-radius:50%; border:none; background:#fff;
    box-shadow:0 3px 8px rgba(0,0,0,0.18); font-size:20px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:active { transform:scale(0.9); }

  #screenTitle .app { display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:44px; }
  .titleLogo { font-size:50px; }
  .titleMain { font-size:22px; font-weight:800; color:#d2691e; margin:6px 0 4px; }
  .titleSub { color:#8a6a4a; font-size:14px; margin-bottom:22px; }
  .bigBtn {
    background: linear-gradient(180deg,#ffb37a,#f0813f); border:none; color:#fff;
    font-weight:800; font-size:17px; padding:15px 30px; border-radius:18px;
    box-shadow:0 6px 0 #c05f24; margin:6px;
  }
  .bigBtn:active { transform:translateY(4px); box-shadow:0 2px 0 #c05f24; }
  .ghostBtn { background:#fff; border:2px solid #ffd0b0; color:#d2691e; font-weight:800; padding:9px 18px; border-radius:14px; margin:6px; }

  /* ---------- select ---------- */
  .catTabs { display:flex; gap:8px; justify-content:center; margin:4px 0 14px; flex-wrap:wrap; }
  .catTab { background:#fff; border:2px solid #ffd7b0; color:#c2691e; font-weight:800; padding:8px 16px; border-radius:14px; font-size:13px; }
  .catTab.active { background:#f0813f; color:#fff; border-color:#c05f24; }
  .topicGrid { display:grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap:12px; }
  .topicCard { background:#fff; border-radius:16px; padding:12px 4px; text-align:center; box-shadow:0 6px 14px rgba(200,120,60,0.16); position:relative; }
  .topicCard:active { transform:scale(0.95); }
  .topicEmoji { font-size:32px; }
  .topicName { font-size:12px; font-weight:800; color:#8a5a34; margin-top:4px; }
  .doneBadge { position:absolute; top:4px; right:4px; background:#4caf50; color:#fff; border-radius:50%; width:20px; height:20px; font-size:12px; display:flex; align-items:center; justify-content:center; }

  /* ---------- draw ---------- */
  .playHeader { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .playTitle { font-size:16px; font-weight:800; color:#d2691e; }
  .stepBadge { background:#fff; border-radius:12px; padding:4px 12px; font-weight:800; font-size:12px; color:#d2691e; box-shadow:0 3px 8px rgba(0,0,0,0.12); }
  .instructionBox {
    background:#fff8e8; border:2px solid #ffe0b0; border-radius:14px; padding:10px 14px;
    font-size:14px; font-weight:800; color:#a05a1e; text-align:center; margin-bottom:8px;
  }
  .canvasWrap { position:relative; width:100%; max-width:510px; margin:0 auto; border-radius:18px; overflow:hidden; box-shadow:0 10px 26px rgba(0,0,0,0.18); background:#fffdf9; }
  #guideSvg, #drawCanvas { position:absolute; top:0; left:0; width:100%; height:auto; display:block; }
  #guideSvg { position:relative; z-index:1; pointer-events:none; }
  #drawCanvas { z-index:2; touch-action:none; }

  .paletteRow { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:12px 0 4px; }
  .penSwatch { width:34px; height:34px; border-radius:50%; border:3px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.25); }
  .penSwatch.selected { border-color:#333; transform:scale(1.15); box-shadow:0 0 0 3px #ffd700; }

  .toolRow { display:flex; justify-content:center; gap:10px; margin-top:8px; }
  .toolBtn { background:#fff; border:2px solid #ffd7b0; color:#c2691e; font-weight:800; padding:8px 14px; border-radius:12px; font-size:13px; }

  .navRow { display:flex; justify-content:space-between; gap:12px; margin-top:14px; max-width:510px; margin-left:auto; margin-right:auto; }
  .navBtn { flex:1; padding:13px; border-radius:16px; border:none; font-weight:800; font-size:15px; background:#fff; color:#c2691e; box-shadow:0 4px 0 #ffd7b0; }
  .navBtn:disabled { opacity:0.4; }
  .navBtn.finish { background:linear-gradient(180deg,#8dffa0,#3fc35b); color:#fff; box-shadow:0 4px 0 #2a9450; }
  .navBtn:active:not(:disabled) { transform:translateY(3px); box-shadow:none; }

  .celebrate-overlay {
    position:fixed; inset:0; background: rgba(255,255,255,0.94);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; z-index:20; padding:20px;
    animation: fadeIn .35s ease;
  }
  .celebrate-overlay[hidden] { display:none; }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  .celebrate-emoji { font-size:56px; animation: bounce .6s ease infinite alternate; }
  @keyframes bounce { from{ transform:translateY(0);} to{ transform:translateY(-14px);} }
  .celebrate-text { font-size:22px; color:#d2691e; font-weight:800; margin-top:6px; }
  .celebrate-sub { font-size:13px; color:#8a6a4a; margin-top:6px; }
  .confetti-piece { position:absolute; top:-16px; width:10px; height:16px; opacity:0.95; border-radius:2px; }

  .toolBtn.on { background:#f0813f; color:#fff; border-color:#c05f24; }
  .toolRow { flex-wrap:wrap; }
  .reveal { position:relative; width:min(84vw,380px); aspect-ratio:1; margin:12px 0; border-radius:20px; overflow:hidden; box-shadow:0 10px 26px rgba(0,0,0,0.2); background:#fffdf9; }
  .revealA, .revealB { position:absolute; inset:0; transition:opacity 1.4s ease; }
  .revealA { opacity:1; }
  .revealB { opacity:0; }
  .reveal.magic .revealA { opacity:0; }
  .reveal.magic .revealB { opacity:1; }
  .sparkles span { position:absolute; font-size:22px; opacity:0; animation: spark 1.4s ease-out forwards; pointer-events:none; }
  @keyframes spark { 0%{opacity:0; transform:scale(0.3);} 40%{opacity:1; transform:scale(1.3);} 100%{opacity:0; transform:scale(0.8) translateY(-14px);} }
  .thumb { width:52px; height:52px; margin:0 auto; border-radius:12px; overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,0.2); }
  #previewOverlay { z-index:30; }
</style>

<div id="screenTitle" class="screen">

    <div class="titleSub">まる・さんかく・せんを くみあわせて、じょうずに かいてみよう！</div>
    <button class="bigBtn" id="btnStart">▶ はじめる</button>
  </div>

<!-- ===== Select ===== -->
<div id="screenSelect" class="screen">

<!-- ===== Draw ===== -->

    </div>

      <canvas id="drawCanvas" width="450" height="450"></canvas>
    </div>
    <div class="paletteRow" id="paletteRow"></div>
    <div class="toolRow" id="penTypes"></div>
    <div class="toolRow">
      <button class="toolBtn" id="btnPreview">👀 かんせいを みる</button>
      <button class="toolBtn" id="btnClear">🧽 けす</button>
    </div>
    <div class="navRow">
      <button class="navBtn" id="btnPrevStep">◀ まえへ</button>
      <button class="navBtn" id="btnNextStep">つぎへ ▶</button>
    </div>
  </div>

<div class="celebrate-overlay" id="celebrateOverlay" hidden></div>
<div class="celebrate-overlay" id="previewOverlay" hidden></div>

/* ===================== 図形レンダラー ===================== */
function strokeAttrs(mode){
  if(mode==='guide') return 'stroke="#b0b0b0" stroke-width="3" stroke-dasharray="6,5"';
  return 'stroke="#333" stroke-width="3.5"';
}
function stepShapeSvg(s, mode){
  var sa = strokeAttrs(mode);
  if(s.type==='circle') return '<circle cx="'+s.cx+'" cy="'+s.cy+'" r="'+s.r+'" '+sa+' fill="none"/>';
  if(s.type==='dot') return '<circle cx="'+s.cx+'" cy="'+s.cy+'" r="'+s.r+'" fill="'+(mode==='guide'?'#c9c9c9':'#333')+'" stroke="none"/>';
  if(s.type==='ellipse'){
    var pivotX = (s.pivotX!=null) ? s.pivotX : s.cx;
    var pivotY = (s.pivotY!=null) ? s.pivotY : s.cy;
    var rot = s.rot||0;
    return '<ellipse cx="'+s.cx+'" cy="'+s.cy+'" rx="'+s.rx+'" ry="'+s.ry+'" transform="rotate('+rot+' '+pivotX+' '+pivotY+')" '+sa+' fill="none"/>';
  }
  if(s.type==='triangle'){
    var pts = s.points.map(function(p){ return p[0]+','+p[1]; }).join(' ');
    return '<polygon points="'+pts+'" '+sa+' fill="none"/>';
  }
  if(s.type==='rect') return '<rect x="'+s.x+'" y="'+s.y+'" width="'+s.w+'" height="'+s.h+'" '+sa+' fill="none"/>';
  if(s.type==='line'){
    var pts2 = s.points.map(function(p){ return p[0]+','+p[1]; }).join(' ');
    return '<polyline points="'+pts2+'" '+sa+' fill="none" stroke-linecap="round"/>';
  }
  if(s.type==='curve'){
    var p0=s.points[0], pc=s.points[1], p1=s.points[2];
    return '<path d="M '+p0[0]+' '+p0[1]+' Q '+pc[0]+' '+pc[1]+' '+p1[0]+' '+p1[1]+'" '+sa+' fill="none" stroke-linecap="round"/>';
  }
  return '';
}

var paintSeq = 0;
function toHex(n){ n=Math.max(0,Math.min(255,Math.round(n))); return (n<16?'0':'')+n.toString(16); }
function shade(hex, amt){
  var h = hex.replace('#','');
  if(h.length===3) h = h.split('').map(function(c){ return c+c; }).join('');
  var n = parseInt(h,16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  function f(c){ return amt<0 ? c*(1+amt) : c+(255-c)*amt; }
  return '#'+toHex(f(r))+toHex(f(g))+toHex(f(b));
}
function rotPt(px,py,pvx,pvy,deg){
  var a = deg*Math.PI/180, dx=px-pvx, dy=py-pvy;
  return [pvx+dx*Math.cos(a)-dy*Math.sin(a), pvy+dx*Math.sin(a)+dy*Math.cos(a)];
}
function pivotOf(s){ return [s.pivotX!=null?s.pivotX:s.cx, s.pivotY!=null?s.pivotY:s.cy]; }
function centerOf(s){
  if(s.type==='circle') return [s.cx,s.cy];
  if(s.type==='ellipse'){ var pv=pivotOf(s); return rotPt(s.cx,s.cy,pv[0],pv[1],s.rot||0); }
  if(s.type==='rect') return [s.x+s.w/2, s.y+s.h/2];
  if(s.type==='triangle') return [(s.points[0][0]+s.points[1][0]+s.points[2][0])/3,(s.points[0][1]+s.points[1][1]+s.points[2][1])/3];
  return null;
}
function pointInShape(px,py,s){
  if(s.type==='circle') return Math.hypot(px-s.cx,py-s.cy) < s.r;
  if(s.type==='ellipse'){
    var pv=pivotOf(s), q=rotPt(px,py,pv[0],pv[1],-(s.rot||0));
    return Math.pow((q[0]-s.cx)/s.rx,2)+Math.pow((q[1]-s.cy)/s.ry,2) < 1;
  }
  if(s.type==='rect') return px>s.x && px<s.x+s.w && py>s.y && py<s.y+s.h;
  if(s.type==='triangle'){
    var p=s.points;
    function sg(a,b,c){ return (a[0]-c[0])*(b[1]-c[1])-(b[0]-c[0])*(a[1]-c[1]); }
    var d1=sg([px,py],p[0],p[1]), d2=sg([px,py],p[1],p[2]), d3=sg([px,py],p[2],p[0]);
    return !((d1<0||d2<0||d3<0) && (d1>0||d2>0||d3>0));
  }
  return false;
}
function isClosed(s){ return s.type==='circle'||s.type==='ellipse'||s.type==='triangle'||s.type==='rect'; }
function samplePts(s){
  var i, a=[];
  if(s.type==='line'){
    if(s.points.length===2){
      for(i=0;i<=12;i++){ var t=i/12; a.push([s.points[0][0]+(s.points[1][0]-s.points[0][0])*t, s.points[0][1]+(s.points[1][1]-s.points[0][1])*t]); }
      return a;
    }
    return s.points.slice();
  }
  var p0=s.points[0],pc=s.points[1],p1=s.points[2];
  for(i=0;i<=24;i++){ var tt=i/24, u=1-tt;
    a.push([u*u*p0[0]+2*u*tt*pc[0]+tt*tt*p1[0], u*u*p0[1]+2*u*tt*pc[1]+tt*tt*p1[1]]); }
  return a;
}
function ptsD(pts){ return 'M'+pts.map(function(p){ return p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' L'); }
function taperPath(pts, w, mode){
  var L=[], R=[], n=pts.length;
  for(var i=0;i<n;i++){
    var a=pts[Math.max(0,i-1)], b=pts[Math.min(n-1,i+1)];
    var dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy)||1, nx=-dy/len, ny=dx/len, t=i/(n-1);
    var hw = mode==='leaf' ? (w/2)*Math.pow(Math.sin(Math.PI*t),0.7) : (w/2)*(1-0.45*t);
    L.push([pts[i][0]+nx*hw, pts[i][1]+ny*hw]);
    R.push([pts[i][0]-nx*hw, pts[i][1]-ny*hw]);
  }
  return ptsD(L.concat(R.reverse()))+' Z';
}

function paintTopic(topic){
  var pid = 'p'+(++paintSeq)+'_';
  var look = LOOKS[topic.id] || { base:'#cccccc' };
  var defs = '', body = '', gN = 0;
  function grad(color, dark){
    var gid = pid+'g'+(gN++);
    defs += '<radialGradient id="'+gid+'" cx="35%" cy="28%" r="82%"><stop offset="0" stop-color="'+shade(color,0.42)+'"/><stop offset="0.5" stop-color="'+color+'"/><stop offset="1" stop-color="'+(dark||look.dark||shade(color,-0.32))+'"/></radialGradient>';
    return 'url(#'+gid+')';
  }
  defs += '<linearGradient id="'+pid+'sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ff"/><stop offset="0.7" stop-color="#eef9ff"/><stop offset="1" stop-color="#fff6d8"/></linearGradient>'
    + '<linearGradient id="'+pid+'hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd67a"/><stop offset="1" stop-color="#6fb25a"/></linearGradient>'
    + '<filter id="'+pid+'fur" x="-8%" y="-8%" width="116%" height="116%">'
    + '<feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="3" result="n"/>'
    + '<feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G" result="d"/>'
    + '<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="t"/>'
    + '<feColorMatrix in="t" type="matrix" values="0 0 0 0 0.25 0 0 0 0 0.15 0 0 0 0 0.05 0 0 0 1.4 -0.5" result="c"/>'
    + '<feComposite in="c" in2="d" operator="in" result="cc"/>'
    + '<feMerge><feMergeNode in="d"/><feMergeNode in="cc"/></feMerge></filter>'
    + '<filter id="'+pid+'soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.8"/></filter>'
    + '<filter id="'+pid+'blur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>';

  /* ---- 図形を集めて重なり順を決める ---- */
  var items = [];
  topic.steps.forEach(function(st, si){
    st.shapes.forEach(function(s, sj){
      var spec = {}, a = (look.st||{})[si], b = (look.sh||{})[si+'.'+sj], k;
      if(a) for(k in a) spec[k]=a[k];
      if(b) for(k in b) spec[k]=b[k];
      items.push({ s:s, si:si, sj:sj, spec:spec, order:items.length });
    });
  });
  var minX=999,maxX=-999,maxY=-999;
  function grow(x,y){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y>maxY)maxY=y; }
  items.forEach(function(it){
    var s = it.s, spec = it.spec;
    if(isClosed(it.s)){
      var c = centerOf(s), front = false;
      items.forEach(function(o){
        if(o.si<it.si && isClosed(o.s) && pointInShape(c[0],c[1],o.s)) front = true;
      });
      if(spec.front!=null) front = spec.front;
      it.z = spec.z!=null ? spec.z : (front ? 1000+it.order : -it.order);
      if(s.type==='circle'){ grow(s.cx-s.r,s.cy+s.r); grow(s.cx+s.r,s.cy+s.r); }
      else if(s.type==='ellipse'){ grow(s.cx-s.rx,s.cy+s.ry); grow(s.cx+s.rx,s.cy+s.ry); }
      else if(s.type==='rect'){ grow(s.x,s.y+s.h); grow(s.x+s.w,s.y+s.h); }
      else { s.points.forEach(function(p){ grow(p[0],p[1]); }); }
    } else if(s.type==='dot'){
      it.z = 3000+it.order;
    } else {
      it.z = spec.z!=null ? spec.z : (spec.tube ? -300+it.order*0.01 : 2000+it.order);
      if(spec.tube) s.points.forEach(function(p){ grow(p[0],p[1]+ (spec.tube.w||0)/2); });
    }
  });
  items.sort(function(a,b){ return a.z-b.z; });

  /* ---- 背景 ---- */
  body += '<rect width="300" height="300" fill="url(#'+pid+'sky)"/>';
  body += '<ellipse cx="60" cy="300" rx="170" ry="60" fill="#b7e08f" opacity="0.7"/>';
  body += '<ellipse cx="170" cy="318" rx="260" ry="72" fill="url(#'+pid+'hill)"/>';
  if(look.glow){
    var g0 = items.filter(function(i){ return i.s.type==='circle'; })[0].s;
    var gid = pid+'glow';
    defs += '<radialGradient id="'+gid+'"><stop offset="0.4" stop-color="'+look.glow+'" stop-opacity="0.85"/><stop offset="1" stop-color="'+look.glow+'" stop-opacity="0"/></radialGradient>';
    body += '<circle cx="'+g0.cx+'" cy="'+g0.cy+'" r="'+(g0.r*2.1)+'" fill="url(#'+gid+')"/>';
  }
  if(!look.noShadow && maxX>minX){
    body += '<ellipse cx="'+((minX+maxX)/2)+'" cy="'+(Math.min(maxY,290)-1)+'" rx="'+Math.max(30,(maxX-minX)*0.36)+'" ry="7" fill="#1b3a10" opacity="0.28" filter="url(#'+pid+'blur)"/>';
  }

  /* ---- 描画 ---- */
  var lineDark = shade(look.base,-0.62);

  function dotSvg(s, spec){

      out += '<circle cx="'+s.cx+'" cy="'+s.cy+'" r="'+(r*0.85)+'" fill="#1c1410"/>';
    } else if(d.k==='iris'){
      out += '<circle cx="'+s.cx+'" cy="'+s.cy+'" r="'+(r*1.45)+'" fill="'+grad(d.c||'#7ec850','#2f6a1a')+'" stroke="#2a2018" stroke-width="1"/>';
      out += '<ellipse cx="'+s.cx+'" cy="'+s.cy+'" rx="'+(r*0.42)+'" ry="'+(r*1.1)+'" fill="#12100c"/>';
    } else if(d.k==='fruit'){
      out += '<circle cx="'+(s.cx+1)+'" cy="'+(s.cy+2)+'" r="'+r+'" fill="#000" opacity="0.18"/>';
      out += '<circle cx="'+s.cx+'" cy="'+s.cy+'" r="'+r+'" fill="'+grad(d.c||'#e2342d')+'" stroke="'+shade(d.c||'#e2342d',-0.45)+'" stroke-width="0.8"/>';
      out += '<circle cx="'+(s.cx-r*0.35)+'" cy="'+(s.cy-r*0.4)+'" r="'+(r*0.28)+'" fill="#fff" opacity="0.8"/>';
      return out;
    } else {
      out += '<circle cx="'+s.cx+'" cy="'+s.cy+'" r="'+(r*1.25)+'" fill="'+grad('#3a2e28','#0d0a08')+'"/>';
    }
    out += '<circle cx="'+(s.cx-r*0.4)+'" cy="'+(s.cy-r*0.45)+'" r="'+(r*0.42)+'" fill="#fff"/>';
    out += '<circle cx="'+(s.cx+r*0.45)+'" cy="'+(s.cy+r*0.4)+'" r="'+(r*0.2)+'" fill="#fff" opacity="0.75"/>';
    return out;
  }
  function closedSvg(s, spec, fill, dark, inner){
    var gr = spec.flat ? fill : grad(fill, dark);
    var strokeC = (spec.nostroke||look.nostroke) ? 'none' : shade(fill,-0.4);
    var sw = strokeC==='none' ? 0 : 1.4;
    var o = '', tf = '';
    if(s.type==='circle'){
      o = '<circle cx="'+s.cx+'" cy="'+s.cy+'" r="'+s.r+'" fill="'+gr+'" stroke="'+strokeC+'" stroke-width="'+sw+'"/>';
      if(spec.seeds){
        for(var i=0;i<46;i++){
          var rr = s.r*0.9*Math.sqrt(i/46), an = i*2.39996;
          o += '<circle cx="'+(s.cx+rr*Math.cos(an)).toFixed(1)+'" cy="'+(s.cy+rr*Math.sin(an)).toFixed(1)+'" r="1.8" fill="#24150a"/>';
          o += '<circle cx="'+(s.cx+rr*Math.cos(an)-0.5).toFixed(1)+'" cy="'+(s.cy+rr*Math.sin(an)-0.6).toFixed(1)+'" r="0.7" fill="#9a6a38"/>';
        }
      }
    } else if(s.type==='ellipse'){
      var pv = pivotOf(s);
      tf = ' transform="rotate('+(s.rot||0)+' '+pv[0]+' '+pv[1]+')"';
      o = '<ellipse cx="'+s.cx+'" cy="'+s.cy+'" rx="'+s.rx+'" ry="'+s.ry+'"'+tf+' fill="'+gr+'" stroke="'+strokeC+'" stroke-width="'+sw+'"/>';
      if(inner){
        o += '<ellipse cx="'+s.cx+'" cy="'+(s.cy+(pv[1]-s.cy)*0.18)+'" rx="'+(s.rx*0.55)+'" ry="'+(s.ry*0.6)+'"'+tf+' fill="'+grad(inner)+'" opacity="0.92"/>';
      }
    } else if(s.type==='triangle'){
      var p = s.points, ct = centerOf(s);
      var pts = p.map(function(q){ return q[0]+','+q[1]; }).join(' ');
      o = '<polygon points="'+pts+'" fill="'+gr+'" stroke="'+fill+'" stroke-width="5" stroke-linejoin="round"/>';
      if(inner){
        var ip = p.map(function(q){ return (ct[0]+(q[0]-ct[0])*0.5).toFixed(1)+','+(ct[1]+(q[1]-ct[1])*0.5).toFixed(1); }).join(' ');
        o += '<polygon points="'+ip+'" fill="'+grad(inner)+'" stroke="'+inner+'" stroke-width="3" stroke-linejoin="round"/>';
      }
    } else if(s.type==='rect'){
      o = '<rect x="'+s.x+'" y="'+s.y+'" width="'+s.w+'" height="'+s.h+'" rx="'+(spec.r||4)+'" fill="'+gr+'" stroke="'+strokeC+'" stroke-width="'+sw+'"/>';
    }
    return o;
  }
  items.forEach(function(it){
    var s = it.s, spec = it.spec;
    if(isClosed(s)){
      var fill = spec.fill || look.base;
      body += '<g'+furAttr(spec)+'>'+closedSvg(s, spec, fill, spec.dark, spec.inner)+'</g>';
    } else if(s.type==='dot'){
      body += dotSvg(s, spec);
    } else {
      var pts = samplePts(s);
      if(spec.tube){
        var tb = spec.tube;
        if(tb.t){
          var d = taperPath(pts, tb.w, tb.t);
          body += '<g'+(look.fur?' filter="url(#'+pid+'fur)"':'')+'><path d="'+d+'" fill="'+grad(tb.c)+'" stroke="'+shade(tb.c,-0.4)+'" stroke-width="1.2" stroke-linejoin="round"/>';
          if(tb.t==='leaf') body += '<path d="'+ptsD(pts)+'" fill="none" stroke="'+shade(tb.c,0.45)+'" stroke-width="1.4" opacity="0.7"/>';
          body += '</g>';
        } else {
          body += '<g'+(look.fur?' filter="url(#'+pid+'fur)"':'')+'><path d="'+ptsD(pts)+'" fill="none" stroke="'+shade(tb.c,-0.4)+'" stroke-width="'+(tb.w+2.5)+'" stroke-linecap="round" stroke-linejoin="round"/>'
            + '<path d="'+ptsD(pts)+'" fill="none" stroke="'+tb.c+'" stroke-width="'+tb.w+'" stroke-linecap="round" stroke-linejoin="round"/>'
            + '<path d="'+ptsD(pts.map(function(q){ return [q[0]-tb.w*0.15,q[1]-tb.w*0.15]; }))+'" fill="none" stroke="'+shade(tb.c,0.5)+'" stroke-width="'+Math.max(1,tb.w*0.28)+'" stroke-linecap="round" opacity="0.55"/></g>';
        }
      } else if(spec.whisker && s.type==='line'){
        body += '<path d="'+ptsD(pts)+'" fill="none" stroke="#3a2a20" stroke-width="2.4" stroke-linecap="round" opacity="0.25"/>'
          + '<path d="'+ptsD(pts)+'" fill="none" stroke="#fffaf0" stroke-width="1.3" stroke-linecap="round"/>';
      } else {
        var st = spec.stroke || { c:lineDark, w:2.2 };
        body += '<path d="'+ptsD(pts)+'" fill="none" stroke="'+st.c+'" stroke-width="'+st.w+'" stroke-linecap="round" stroke-linejoin="round"/>';
      }
    }
  });
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%"><defs>'+defs+'</defs>'+body+'</svg>';
}

/* ===================== クレヨン/いろえんぴつ ブラシ ===================== */
var penType = 'crayon';
function stampBrush(x, y, pressure){
  var c = drawCtx, k, i;
  var pr = pressure>0 ? 0.65+pressure*0.7 : 1;
  c.fillStyle = currentPenColor;
  if(penType==='crayon'){
    var W = 12*pr;
    c.globalAlpha = 0.5; c.beginPath(); c.arc(x,y,W*0.42,0,6.283); c.fill();
    for(k=0;k<7;k++){
      var a = Math.random()*6.283, d = Math.sqrt(Math.random())*W*0.5;
      c.globalAlpha = 0.3+Math.random()*0.5;
      c.beginPath(); c.arc(x+Math.cos(a)*d, y+Math.sin(a)*d, 1.2+Math.random()*2.2, 0, 6.283); c.fill();
    }
  } else if(penType==='pencil'){
    var W2 = 4.6*pr;
    c.globalAlpha = 0.65; c.beginPath(); c.arc(x,y,W2*0.32,0,6.283); c.fill();
    for(i=0;i<4;i++){
      var a2 = Math.random()*6.283, d2 = Math.sqrt(Math.random())*W2*0.55;
      c.globalAlpha = 0.35+Math.random()*0.5;
      c.beginPath(); c.arc(x+Math.cos(a2)*d2, y+Math.sin(a2)*d2, 0.7+Math.random()*0.9, 0, 6.283); c.fill();
    }
  }
  c.globalAlpha = 1;
}
function brushSegment(a, b, pressure){
  var dist = Math.hypot(b.x-a.x, b.y-a.y), stepPx = penType==='pencil' ? 1.2 : 2, n = Math.max(1, Math.ceil(dist/stepPx));
  for(var i=1;i<=n;i++){ stampBrush(a.x+(b.x-a.x)*i/n, a.y+(b.y-a.y)*i/n, pressure); }
}

/* ===================== 進捗保存 ===================== */
function loadCompleted(){
  try{ return JSON.parse(localStorage.getItem('ekaki_completed')||'[]'); }catch(e){ return []; }
}
function saveCompleted(arr){ try{ localStorage.setItem('ekaki_completed', JSON.stringify(arr)); }catch(e){} }
function markCompleted(id){
  var arr = loadCompleted();
  if(arr.indexOf(id)===-1){ arr.push(id); saveCompleted(arr); }
}

/* ===================== 音 ===================== */
var audioCtx = null;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function playTone(freq,dur,delay,type){
  ensureAudio();
  if(!audioCtx) return;
  delay = delay||0;
  var t0 = audioCtx.currentTime+delay;
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  osc.type = type||'sine';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.2,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur+0.03);
}
function playStep(){ playTone(650+Math.random()*100, 0.09); }
function playDone(){ [523,659,784,1046].forEach(function(f,i){ playTone(f,0.28,i*0.15); }); }

/* ===================== 画面/状態 ===================== */
var PEN_COLORS = ['#e53935','#f57c00','#fdd835','#43a047','#1e88e5','#8e24aa','#ec407a','#5d4037'];
var currentCategory = 'animal';
var currentTopicIndex = 0;
var currentStep = 0;
var currentPenColor = PEN_COLORS[0];
var canvas, drawCtx;
var isDrawing = false;

function showScreen(name){
  ['screenTitle','screenSelect','screenDraw'].forEach(function(id){
    document.getElementById(id).style.display = (id===name) ? 'block' : 'none';
  });
}

function renderCatTabs(){
  var cats = [];
  TOPICS.forEach(function(t){ if(cats.indexOf(t.category)===-1) cats.push(t.category); });
  var el = document.getElementById('catTabs');
  el.innerHTML = cats.map(function(c){
    return '<button class="catTab'+(c===currentCategory?' active':'')+'" data-cat="'+c+'">'+(CATEGORY_LABEL[c]||c)+'</button>';
  }).join('');
  el.querySelectorAll('.catTab').forEach(function(btn){
    btn.addEventListener('click', function(){
      currentCategory = btn.getAttribute('data-cat');
      renderCatTabs();
      renderTopicGrid();
    });
  });
}

function renderTopicGrid(){
  var completed = loadCompleted();
  var list = TOPICS.filter(function(t){ return t.category===currentCategory; });
  var el = document.getElementById('topicGrid');
  el.innerHTML = list.map(function(t){
    var idx = TOPICS.indexOf(t);
    var done = completed.indexOf(t.id) !== -1;
    return '<button class="topicCard" data-idx="'+idx+'">' +
      (done ? '<div class="doneBadge">✓</div>' : '') +
      (done ? '<div class="thumb">'+paintTopic(t)+'</div>' : '<div class="topicEmoji">'+t.emoji+'</div>') +
      '<div class="topicName">'+t.title+'</div>' +
      '</button>';
  }).join('');
  el.querySelectorAll('.topicCard').forEach(function(btn){
    btn.addEventListener('click', function(){
      openTopic(parseInt(btn.getAttribute('data-idx'),10));
    });
  });
}

function openTopic(idx){
  currentTopicIndex = idx;
  currentStep = 0;
  showScreen('screenDraw');
  clearCanvas();
  renderDrawScreen();
}

function renderGuide(){
  var topic = TOPICS[currentTopicIndex];
  var html = '';
  for(var i=0;i<=currentStep;i++){
    var mode = (i===currentStep) ? 'guide' : 'done';
    topic.steps[i].shapes.forEach(function(s){ html += stepShapeSvg(s, mode); });
  }
  document.getElementById('guideSvg').innerHTML = html;
}

function renderDrawScreen(){
  var topic = TOPICS[currentTopicIndex];
  document.getElementById('drawTitle').textContent = topic.emoji + ' ' + topic.title;
  document.getElementById('stepBadge').textContent = (currentStep+1) + ' / ' + topic.steps.length;
  document.getElementById('instructionBox').textContent = topic.steps[currentStep].text;
  renderGuide();
  document.getElementById('btnPrevStep').disabled = (currentStep===0);
  var isLast = (currentStep === topic.steps.length-1);
  var nextBtn = document.getElementById('btnNextStep');
  nextBtn.textContent = isLast ? '🎉 できた！' : 'つぎへ ▶';
  nextBtn.className = 'navBtn' + (isLast ? ' finish' : '');
}

function clearCanvas(){
  if(!drawCtx) return;
  drawCtx.clearRect(0,0,canvas.width,canvas.height);
}

function getCanvasPoint(e){
  var rect = canvas.getBoundingClientRect();
  var scaleX = canvas.width / rect.width;
  var scaleY = canvas.height / rect.height;
  return { x: (e.clientX-rect.left)*scaleX, y: (e.clientY-rect.top)*scaleY };
}

var lastPt = null;
function initCanvasEvents(){
  canvas.addEventListener('pointerdown', function(e){
    isDrawing = true;
    var p = getCanvasPoint(e);
    lastPt = p;
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    if(penType==='plain'){ drawCtx.beginPath(); drawCtx.moveTo(p.x, p.y); }
    else stampBrush(p.x, p.y, e.pointerType==='pen' ? e.pressure : 0);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function(e){
    if(!isDrawing) return;
    var p = getCanvasPoint(e);
    if(penType==='plain'){
      drawCtx.lineTo(p.x, p.y);
      drawCtx.strokeStyle = currentPenColor;
      drawCtx.lineWidth = 7;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      drawCtx.stroke();
    } else {
      brushSegment(lastPt, p, e.pointerType==='pen' ? e.pressure : 0);
    }
    lastPt = p;
  });
  canvas.addEventListener('pointerup', function(){ isDrawing = false; });
  canvas.addEventListener('pointercancel', function(){ isDrawing = false; });
}

function renderPenTypes(){
  var el = document.getElementById('penTypes');
  var types = [['crayon','🖍️ クレヨン'],['pencil','✏️ いろえんぴつ'],['plain','🖊️ ふつう']];
  el.innerHTML = types.map(function(t){
    return '<button class="toolBtn'+(penType===t[0]?' on':'')+'" data-pen="'+t[0]+'">'+t[1]+'</button>';
  }).join('');
  el.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ penType = b.getAttribute('data-pen'); renderPenTypes(); });
  });
}

function renderPalette(){
  var el = document.getElementById('paletteRow');
  el.innerHTML = PEN_COLORS.map(function(c,i){
    return '<div class="penSwatch'+(c===currentPenColor?' selected':'')+'" data-color="'+c+'" style="background:'+c+'"></div>';
  }).join('');
  el.querySelectorAll('.penSwatch').forEach(function(sw){
    sw.addEventListener('click', function(){
      currentPenColor = sw.getAttribute('data-color');
      renderPalette();
    });
  });
}

function goPrevStep(){
  if(currentStep>0){ currentStep--; playStep(); renderDrawScreen(); }
}
function goNextStep(){
  var topic = TOPICS[currentTopicIndex];
  if(currentStep < topic.steps.length-1){
    currentStep++;
    playStep();
    renderDrawScreen();
  } else {
    finishTopic();
  }
}

var confettiColors = ['#ffb37a','#ffd700','#70a1ff','#7bed9f','#ff8fc7','#ba68c8'];
function finishTopic(){
  var topic = TOPICS[currentTopicIndex];
  markCompleted(topic.id);
  playDone();
  var overlay = document.getElementById('celebrateOverlay');
  var guideDone = '';
  topic.steps.forEach(function(st){ st.shapes.forEach(function(sh){ guideDone += stepShapeSvg(sh,'done'); }); });
  var kid = '';
  try{ kid = canvas.toDataURL('image/png'); }catch(e){}
  overlay.innerHTML =
    '<div class="celebrate-text">「'+topic.title+'」がかけたね！</div>' +
    '<div class="reveal" id="reveal">' +
      '<div class="revealA"><svg viewBox="0 0 300 300" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">'+guideDone+
        (kid?'<image href="'+kid+'" x="0" y="0" width="300" height="300"/>':'')+'</svg></div>' +
      '<div class="revealB">'+paintTopic(topic)+'</div>' +
      '<div class="sparkles" id="sparkles"></div>' +
    '</div>' +
    '<div class="celebrate-sub" id="revealSub">🪄 まほうで ほんものみたいに かわるよ…</div>';
  for (var i=0; i<26; i++){
    var piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (Math.random()*100) + '%';
    piece.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
    var dur = 1.2 + Math.random()*1.3;
    var delay = Math.random()*0.6;
    piece.style.animation = 'confettiFall ' + dur + 's linear ' + delay + 's forwards';
    overlay.appendChild(piece);
  }
  overlay.hidden = false;
  var ready = false;
  setTimeout(function(){
    var rv = document.getElementById('reveal'); if(!rv) return;
    rv.className = 'reveal magic';
    var sp = document.getElementById('sparkles'), h = '';
    for(var j=0;j<14;j++){ h += '<span style="left:'+(Math.random()*90+3)+'%;top:'+(Math.random()*90+3)+'%;animation-delay:'+(Math.random()*0.6)+'s">✨</span>'; }
    sp.innerHTML = h;
    playTone(880,0.2,0); playTone(1174,0.3,0.12);
  }, 1300);
  setTimeout(function(){
    var sub = document.getElementById('revealSub');
    if(sub) sub.textContent = 'できあがり！ じょうずにかけました (タップでとじる)';
    ready = true;
  }, 2600);
  overlay.addEventListener('click', function closeIt(){
    if(!ready) return;
    overlay.hidden = true;
    overlay.removeEventListener('click', closeIt);
    renderCatTabs();
    renderTopicGrid();
    showScreen('screenSelect');
  });
}

function showPreview(){
  var topic = TOPICS[currentTopicIndex];
  var ov = document.getElementById('previewOverlay');
  ov.innerHTML = '<div class="celebrate-text">👀 かんせいの おてほん</div><div class="reveal" style="opacity:1"><div class="revealB" style="opacity:1">'+paintTopic(topic)+'</div></div><div class="celebrate-sub">こんなふうに なるよ！ (タップでとじる)</div>';
  ov.hidden = false;
  ov.onclick = function(){ ov.hidden = true; };
}

var styleEl = document.createElement('style');
styleEl.textContent = '@keyframes confettiFall { to { transform: translateY(420px) rotate(360deg); opacity: 0.25; } }';
document.head.appendChild(styleEl);

function init(){
  canvas = document.getElementById('drawCanvas');
  drawCtx = canvas.getContext('2d');
  initCanvasEvents();
  renderPalette();
  renderPenTypes();
  document.getElementById('btnPreview').addEventListener('click', showPreview);

  document.getElementById('btnStart').addEventListener('click', function(){
    renderCatTabs();
    renderTopicGrid();
    showScreen('screenSelect');
  });
  document.getElementById('btnSelectBack').addEventListener('click', function(){ showScreen('screenTitle'); });
  document.getElementById('btnDrawBack').addEventListener('click', function(){
    renderCatTabs();
    renderTopicGrid();
    showScreen('screenSelect');
  });
  document.getElementById('btnClear').addEventListener('click', clearCanvas);
  document.getElementById('btnPrevStep').addEventListener('click', goPrevStep);
  document.getElementById('btnNextStep').addEventListener('click', goNextStep);

  showScreen('screenTitle');
}
document.addEventListener('DOMContentLoaded', init);

})();
</script>
