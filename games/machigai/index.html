<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>まちがいさがし</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-touch-callout: none; }
  html, body {
    margin: 0; padding: 0; min-height:100%;
    font-family: "Hiragino Maru Gothic ProN","Rounded Mplus 1c","Segoe UI",sans-serif;
    background: linear-gradient(160deg, #fff0e1 0%, #ffe1f0 45%, #e6e0ff 100%);
    background-attachment: fixed;
    color:#3a3060;
  }
  button { font-family:inherit; cursor:pointer; }
  h1,h2 { margin:0; }
  .screen { display:none; min-height:100vh; }
  .app { max-width: 760px; margin:0 auto; padding: 14px 12px 30px; }

  header { display:flex; align-items:center; justify-content:space-between; padding:6px 4px 10px; }
  h1.title { font-size:19px; color:#c2456b; text-shadow:0 1px 0 #fff; }
  .icon-btn {
    width:44px; height:44px; border-radius:50%; border:none; background:#fff;
    box-shadow:0 3px 8px rgba(0,0,0,0.18); font-size:20px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:active { transform:scale(0.9); }

  #screenTitle .app { display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:48px; }
  .titleLogo { font-size:50px; }
  .titleMain { font-size:23px; font-weight:800; color:#c2456b; margin:6px 0 4px; }
  .titleSub { color:#8a5a74; font-size:14px; margin-bottom:24px; }
  .bigBtn {
    background: linear-gradient(180deg,#ff9fc0,#e0538a); border:none; color:#fff;
    font-weight:800; font-size:17px; padding:15px 30px; border-radius:18px;
    box-shadow:0 6px 0 #b8386a; margin:6px;
  }
  .bigBtn:active { transform:translateY(4px); box-shadow:0 2px 0 #b8386a; }

  .tierBlock { margin-top: 16px; text-align:left; }
  .tierHead { font-weight:800; color:#c2456b; font-size:14px; margin: 0 4px 8px; }
  .puzzleGrid { display:grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap:10px; }
  .puzzleCard {
    background:#fff; border-radius:16px; padding:12px 4px; text-align:center;
    box-shadow:0 6px 14px rgba(190,60,110,0.18); position:relative;
  }
  .puzzleCard:active { transform:scale(0.95); }
  .puzzleName { font-size:12px; font-weight:800; color:#c2456b; }
  .doneBadge {
    position:absolute; top:4px; right:4px; background:#4caf50; color:#fff;
    border-radius:50%; width:20px; height:20px; font-size:12px;
    display:flex; align-items:center; justify-content:center;
  }

  .playHeader { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .playTitle { font-size:16px; font-weight:800; color:#c2456b; }
  .foundBadge { background:#fff; border-radius:12px; padding:5px 12px; font-weight:800; font-size:13px; color:#c2456b; box-shadow:0 3px 8px rgba(0,0,0,0.12); }
  .stageCard {
    background:#fffdf9; border-radius:22px; box-shadow:0 12px 28px rgba(0,0,0,0.16);
    padding:8px; position:relative; overflow:hidden; max-width:700px; margin:0 auto;
  }
  #puzzleSvg { width:100%; height:auto; display:block; touch-action:manipulation; }
  .hotspotMark { pointer-events:none; }

  .celebrate-overlay {
    position:absolute; inset:0; background: rgba(255,255,255,0.94);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; z-index:20; border-radius:20px; padding:20px;
    animation: fadeIn .35s ease;
  }
  .celebrate-overlay[hidden] { display:none; }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  .celebrate-emoji { font-size:56px; animation: bounce .6s ease infinite alternate; }
  @keyframes bounce { from{ transform:translateY(0);} to{ transform:translateY(-14px);} }
  .celebrate-text { font-size:22px; color:#c2456b; font-weight:800; margin-top:6px; }
  .celebrate-sub { font-size:13px; color:#8a5a74; margin-top:6px; }
  .confetti-piece { position:absolute; top:-16px; width:10px; height:16px; opacity:0.95; border-radius:2px; }
</style>
</head>
<body>

<!-- ===== Title ===== -->
<div id="screenTitle" class="screen">
  <div class="app">
    <div class="titleLogo">🔍✨</div>
    <div class="titleMain">まちがいさがし</div>
    <div class="titleSub">2まいの えを くらべて、ちがうところを みつけよう！</div>
    <button class="bigBtn" id="btnStart">▶ はじめる</button>
  </div>
</div>

<!-- ===== Select ===== -->
<div id="screenSelect" class="screen">
  <div class="app">
    <header>
      <button class="icon-btn" id="btnSelectBack">🏠</button>
      <h1 class="title">パズルをえらんでね</h1>
      <div style="width:44px;"></div>
    </header>
    <div id="tierBlocks"></div>
  </div>
</div>

<!-- ===== Play ===== -->
<div id="screenPlay" class="screen">
  <div class="app">
    <div class="playHeader">

    </div>
    <div class="stageCard">

        <rect x="0" y="0" width="300" height="300" id="bgLeft" rx="16"/>
        <rect x="340" y="0" width="300" height="300" id="bgRight" rx="16"/>
        <g id="leftLayer"></g>
        <g id="rightLayer"></g>
        <g id="markLayer"></g>
      </svg>
    </div>
  </div>
</div>

<div class="celebrate-overlay" id="celebrateOverlay" hidden></div>

function starPoints(cx, cy, rOuter, rInner){
  var pts = [];
  for(var i=0;i<10;i++){
    var r = (i%2===0) ? rOuter : rInner;
    var ang = (Math.PI/5)*i - Math.PI/2;
    pts.push((cx+r*Math.cos(ang)).toFixed(1) + ',' + (cy+r*Math.sin(ang)).toFixed(1));
  }
  return pts.join(' ');
}
function characterSvg(type, cx, cy, scale, hairColor, outfitColor){
  scale = scale || 1;
  var s = scale;
  var body = '<path d="M '+(cx-24*s)+' '+(cy+40*s)+' L '+(cx+24*s)+' '+(cy+40*s)+' L '+(cx+16*s)+' '+(cy-6*s)+' L '+(cx-16*s)+' '+(cy-6*s)+' Z" fill="'+outfitColor+'"/>';
  var hair = '<ellipse cx="'+cx+'" cy="'+(cy-42*s)+'" rx="'+(26*s)+'" ry="'+(20*s)+'" fill="'+hairColor+'"/>';
  var head = '<circle cx="'+cx+'" cy="'+(cy-30*s)+'" r="'+(22*s)+'" fill="#ffe0c2"/>';
  var eyes = '<circle cx="'+(cx-8*s)+'" cy="'+(cy-28*s)+'" r="'+(3*s)+'" fill="#333"/>' +
             '<circle cx="'+(cx+8*s)+'" cy="'+(cy-28*s)+'" r="'+(3*s)+'" fill="#333"/>';
  var extra = '';
  if(type==='cat'){
    extra = '<polygon points="'+(cx-24*s)+','+(cy-50*s)+' '+(cx-10*s)+','+(cy-70*s)+' '+(cx-4*s)+','+(cy-48*s)+'" fill="'+hairColor+'"/>' +
            '<polygon points="'+(cx+24*s)+','+(cy-50*s)+' '+(cx+10*s)+','+(cy-70*s)+' '+(cx+4*s)+','+(cy-48*s)+'" fill="'+hairColor+'"/>';
  } else if(type==='robot'){
    extra = '<rect x="'+(cx-3*s)+'" y="'+(cy-66*s)+'" width="'+(6*s)+'" height="'+(14*s)+'" fill="#999"/>' +
            '<circle cx="'+cx+'" cy="'+(cy-70*s)+'" r="'+(5*s)+'" fill="#ff6f6f"/>';
  }
  return '<g>' + body + hair + head + eyes + extra + '</g>';
}
function findPropIdx(props, id){
  for(var i=0;i<props.length;i++){ if(props[i].id===id) return i; }
  return -1;
}
function applyDiffs(baseProps, diffs){
  var right = baseProps.map(function(p){
    return { id:p.id, type:p.type, x:p.x, y:p.y, scale:p.scale||1, color:p.color };
  });
  var hotspots = [];
  diffs.forEach(function(d){
    if(d.kind==='add'){
      right.push({ id:d.shape.id, type:d.shape.type, x:d.shape.x, y:d.shape.y, scale:d.shape.scale||1, color:d.shape.color });
      hotspots.push({x:d.shape.x, y:d.shape.y, found:false});
      return;
    }
    var idx = findPropIdx(right, d.prop);
    if(idx<0) return;
    var p = right[idx];
    if(d.kind==='remove'){
      hotspots.push({x:p.x, y:p.y, found:false});
      right.splice(idx,1);
    } else if(d.kind==='color'){
      hotspots.push({x:p.x, y:p.y, found:false});
      p.color = d.to;
    } else if(d.kind==='move'){
      hotspots.push({x:p.x+d.dx, y:p.y+d.dy, found:false});
      p.x += d.dx; p.y += d.dy;
    } else if(d.kind==='resize'){
      hotspots.push({x:p.x, y:p.y, found:false});
      p.scale = (p.scale||1) * d.scale;
    }
  });
  return { rightProps: right, hotspots: hotspots };
}
function hitTest(hotspots, tapX, tapY, isRightPanel, tolerance){
  var localX = isRightPanel ? (tapX - PANEL_OFFSET) : tapX;
  for(var i=0;i<hotspots.length;i++){
    var h = hotspots[i];
    if(h.found) continue;
    var dx = localX - h.x, dy = tapY - h.y;
    if(Math.sqrt(dx*dx+dy*dy) <= tolerance){ h.found = true; return i; }
  }
  return -1;
}
function allFound(hotspots){ return hotspots.every(function(h){ return h.found; }); }

var TIER_LABEL = { easy:'かんたん', normal:'ふつう', hard:'むずかしい' };
var TIER_ORDER = ['easy','normal','hard'];

/* ===================== 進捗保存 ===================== */
function loadCompleted(){
  try{ return JSON.parse(localStorage.getItem('machigai_completed')||'[]'); }catch(e){ return []; }
}
function saveCompleted(arr){ try{ localStorage.setItem('machigai_completed', JSON.stringify(arr)); }catch(e){} }
function markCompleted(id){
  var arr = loadCompleted();
  if(arr.indexOf(id)===-1){ arr.push(id); saveCompleted(arr); }
}

/* ===================== 音 ===================== */
var audioCtx = null;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function playTone(freq,dur,delay,type){
  ensureAudio();
  if(!audioCtx) return;
  delay = delay||0;
  var t0 = audioCtx.currentTime+delay;
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  osc.type = type||'sine';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.22,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur+0.03);
}
function playFound(){ playTone(750+Math.random()*150, 0.12); }
function playWin(){ [523,659,784,1046].forEach(function(f,i){ playTone(f,0.28,i*0.15); }); }

/* ===================== 画面/状態 ===================== */
function showScreen(name){
  ['screenTitle','screenSelect','screenPlay'].forEach(function(id){
    document.getElementById(id).style.display = (id===name) ? 'block' : 'none';
  });
}

var currentPuzzleIndex = 0;
var currentHotspots = [];
var currentTolerance = 24;

function renderSelect(){
  var completed = loadCompleted();
  var el = document.getElementById('tierBlocks');
  var html = '';
  TIER_ORDER.forEach(function(tier){
    var list = PUZZLES.filter(function(p){ return p.tier===tier; });
    if(list.length===0) return;
    html += '<div class="tierBlock"><div class="tierHead">' + TIER_LABEL[tier] + '</div><div class="puzzleGrid">';
    list.forEach(function(p){
      var idx = PUZZLES.indexOf(p);
      var done = completed.indexOf(p.id) !== -1;
      html += '<button class="puzzleCard" data-idx="'+idx+'">' +
        (done ? '<div class="doneBadge">✓</div>' : '') +
        '<div class="puzzleName">'+p.title+'</div>' +
        '</button>';
    });
    html += '</div></div>';
  });
  el.innerHTML = html;
  el.querySelectorAll('.puzzleCard').forEach(function(btn){
    btn.addEventListener('click', function(){
      loadPuzzle(parseInt(btn.getAttribute('data-idx'),10));
    });
  });
}

function renderScene(layerId, props, character, isRight){
  var offset = isRight ? PANEL_OFFSET : 0;
  var html = '<g transform="translate('+offset+',0)">';
  props.forEach(function(p){
    html += propSvg(p.type, p.x, p.y, p.scale||1, p.color);
  });
  html += characterSvg(character.type, character.x, character.y, 1, character.hair, character.outfit);
  html += '</g>';
  document.getElementById(layerId).innerHTML = html;
}

function updateFoundBadge(){
  var found = currentHotspots.filter(function(h){ return h.found; }).length;
  document.getElementById('foundBadge').textContent = '⭐ ' + found + ' / ' + currentHotspots.length;
}

function drawMarks(){
  var html = '';
  currentHotspots.forEach(function(h){
    if(!h.found) return;
    [0, PANEL_OFFSET].forEach(function(off){
      html += '<circle class="hotspotMark" cx="'+(h.x+off)+'" cy="'+h.y+'" r="16" fill="none" stroke="#ff5252" stroke-width="3" stroke-dasharray="4,3"/>';
    });
  });
  document.getElementById('markLayer').innerHTML = html;
}

function onSvgPointerDown(e){
  var svg = document.getElementById('puzzleSvg');
  var rect = svg.getBoundingClientRect();
  if(rect.width===0) return;
  var scaleX = 680 / rect.width;
  var scaleY = 300 / rect.height;
  var localX = (e.clientX - rect.left) * scaleX;
  var localY = (e.clientY - rect.top) * scaleY;
  var isRight = localX >= PANEL_OFFSET;
  var found = hitTest(currentHotspots, localX, localY, isRight, currentTolerance);
  if(found >= 0){
    playFound();
    updateFoundBadge();
    drawMarks();
    if(allFound(currentHotspots)){
      var puzzle = PUZZLES[currentPuzzleIndex];
      markCompleted(puzzle.id);
      playWin();
      celebrate();
    }
  }
}

function loadPuzzle(idx){
  currentPuzzleIndex = idx;
  var puzzle = PUZZLES[idx];
  currentTolerance = TOLERANCE[puzzle.tier] || 24;
  document.getElementById('playTitle').textContent = puzzle.title;
  document.getElementById('bgLeft').setAttribute('fill', puzzle.bg);
  document.getElementById('bgRight').setAttribute('fill', puzzle.bg);

  var result = applyDiffs(puzzle.props, puzzle.diffs);
  currentHotspots = result.hotspots;

  renderScene('leftLayer', puzzle.props, puzzle.character, false);
  renderScene('rightLayer', result.rightProps, puzzle.character, true);
  document.getElementById('markLayer').innerHTML = '';
  updateFoundBadge();

  var overlay = document.getElementById('celebrateOverlay');
  overlay.hidden = true;
  overlay.innerHTML = '';

  showScreen('screenPlay');
}

var confettiColors = ['#ff9fc0','#ffd700','#70a1ff','#7bed9f','#ba68c8','#ffa502'];
function celebrate(){
  var overlay = document.getElementById('celebrateOverlay');
  overlay.innerHTML =
    '<div class="celebrate-emoji">🎉</div>' +
    '<div class="celebrate-text">ぜんぶみつけたね!✨</div>' +
    '<div class="celebrate-sub">すごい かんさつりょく!(タップでとじる)</div>';
  for (var i=0; i<26; i++){
    var piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (Math.random()*100) + '%';
    piece.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
    var dur = 1.2 + Math.random()*1.3;
    var delay = Math.random()*0.6;
    piece.style.animation = 'confettiFall ' + dur + 's linear ' + delay + 's forwards';
    overlay.appendChild(piece);
  }
  overlay.hidden = false;
  overlay.addEventListener('click', function closeIt(){
    overlay.hidden = true;
    overlay.removeEventListener('click', closeIt);
    renderSelect();
    showScreen('screenSelect');
  });
}

var styleEl = document.createElement('style');
styleEl.textContent = '@keyframes confettiFall { to { transform: translateY(320px) rotate(360deg); opacity: 0.25; } }';
document.head.appendChild(styleEl);

function init(){
  document.getElementById('btnStart').addEventListener('click', function(){
    renderSelect();
    showScreen('screenSelect');
  });
  document.getElementById('btnSelectBack').addEventListener('click', function(){ showScreen('screenTitle'); });
  document.getElementById('btnPlayBack').addEventListener('click', function(){
    renderSelect();
    showScreen('screenSelect');
  });
  document.getElementById('puzzleSvg').addEventListener('pointerdown', onSvgPointerDown);
  showScreen('screenTitle');
}
document.addEventListener('DOMContentLoaded', init);

})();
</script>
