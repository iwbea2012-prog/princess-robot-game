<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ブロックぬけだし</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-touch-callout:none; }
  html,body { margin:0; min-height:100%; font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Segoe UI",sans-serif;
    background:linear-gradient(160deg,#ffe9f3 0%,#e9e2ff 50%,#dff0ff 100%); background-attachment:fixed; color:#4a3550; }
  button { font-family:inherit; cursor:pointer; }
  .app { max-width:520px; margin:0 auto; padding:12px 12px 30px; }
  .screen { display:none; }
  header { display:flex; align-items:center; justify-content:space-between; padding:4px 2px 10px; gap:8px; }
  h1 { margin:0; font-size:18px; color:#8e2a6b; }
  .icon-btn { width:44px; height:44px; border-radius:50%; border:none; background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.18); font-size:20px; display:flex; align-items:center; justify-content:center; text-decoration:none; color:inherit; }
  .icon-btn:active { transform:scale(.9); }
  .intro { background:#fff; border-radius:16px; padding:12px 14px; font-size:14px; line-height:1.6; box-shadow:0 4px 12px rgba(0,0,0,.1); margin-bottom:14px; }
  .tier { font-weight:800; color:#8e2a6b; margin:14px 4px 6px; font-size:14px; }
  .levels { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
  .lv { background:#fff; border:none; border-radius:14px; padding:8px 0 6px; box-shadow:0 4px 10px rgba(0,0,0,.12); font-weight:800; color:#8e2a6b; font-size:16px; }
  .lv small { display:block; font-size:10px; height:12px; color:#f5a623; letter-spacing:-1px; }
  .lv:active { transform:scale(.93); }
  .barRow { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .pill { background:#fff; border-radius:12px; padding:5px 12px; font-weight:800; font-size:13px; color:#8e2a6b; box-shadow:0 3px 8px rgba(0,0,0,.12); }
  .boardWrap { width:100%; max-width:460px; margin:0 auto; padding:10px; border-radius:22px; background:linear-gradient(160deg,#b98a5a,#8d6238); box-shadow:0 10px 26px rgba(0,0,0,.28); position:relative; }
  .board { position:relative; width:100%; aspect-ratio:1; background:#f6e7c8; border-radius:12px; overflow:visible;
    background-image:linear-gradient(#e5d3ad 1px,transparent 1px),linear-gradient(90deg,#e5d3ad 1px,transparent 1px); background-size:calc(100%/6) calc(100%/6); }
  .exit { position:absolute; right:-14px; top:calc(100%/6*2 + 100%/6*0.15); width:18px; height:calc(100%/6*0.7); background:repeating-linear-gradient(0deg,#ffd23f 0 8px,#3a2a20 8px 16px); border-radius:0 8px 8px 0; z-index:0; }
  .exitLabel { position:absolute; right:-6px; top:calc(100%/6*2 - 22px); font-size:18px; }
  .veh { position:absolute; width:calc(100%/6*var(--w)); height:calc(100%/6*var(--h)); padding:3px; touch-action:none; z-index:2; }
  .veh .body { width:100%; height:100%; border-radius:14px; background:linear-gradient(160deg,var(--c1),var(--c2)); box-shadow:0 4px 0 rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.4); position:relative; overflow:hidden; }
  .veh .win { position:absolute; background:rgba(255,255,255,.55); border-radius:6px; }
  .veh.h .win { top:18%; bottom:18%; width:18%; }
  .veh.v .win { left:18%; right:18%; height:18%; }
  .veh .lamp { position:absolute; width:9px; height:9px; border-radius:50%; background:#fff6b0; box-shadow:0 0 6px #fff6b0; }
  .veh.dragging { z-index:5; filter:brightness(1.08); }
  .veh.hint .body { animation:hint .6s ease-in-out 4; }
  @keyframes hint { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.09); box-shadow:0 0 0 4px #ffd23f; } }
  .veh.target .crown { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:26px; }
  .veh.out { transition:left .9s ease-in, top .9s ease-in; }
  .toolRow { display:flex; justify-content:center; gap:10px; margin-top:16px; }
  .toolBtn { background:#fff; border:2px solid #e3c9f5; color:#8e2a6b; font-weight:800; padding:10px 18px; border-radius:14px; font-size:14px; }
  .toolBtn:active { transform:translateY(2px); }
  .hintText { text-align:center; min-height:22px; margin-top:10px; font-weight:800; color:#8e2a6b; font-size:15px; }
  .overlay { position:fixed; inset:0; background:rgba(255,255,255,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; z-index:20; padding:20px; }
  .overlay[hidden] { display:none; }
  .ovBig { font-size:24px; font-weight:800; color:#8e2a6b; margin-top:8px; }
  .ovStars { font-size:44px; margin:8px 0; letter-spacing:4px; }
  .ovSub { font-size:14px; color:#7a6a80; margin-bottom:14px; }
  .bigBtn { background:linear-gradient(180deg,#ff9fd0,#e0559f); border:none; color:#fff; font-weight:800; font-size:16px; padding:13px 26px; border-radius:16px; box-shadow:0 5px 0 #a83a76; margin:6px; }
  .bigBtn.sec { background:#fff; color:#8e2a6b; box-shadow:0 5px 0 #e3c9f5; border:2px solid #e3c9f5; }
  .bigBtn:active { transform:translateY(3px); box-shadow:none; }
</style>
</head>
<body>
<div id="screenSelect" class="screen"><div class="app">
  <header><a class="icon-btn" href="../../index.html">🏠</a><h1>🚗 ブロックぬけだし</h1><div style="width:44px"></div></header>
  <div class="intro">ピンクの <b>おうじょさまのくるま 👑</b> を、みぎの <b>でぐち</b> までうごかそう！<br>ほかのくるまを ゆびで スライドして、みちを あけてね。</div>
  <div id="levelsBox"></div>
</div></div>

<div id="screenPlay" class="screen"><div class="app">
  <header><button class="icon-btn" id="btnBack">◀</button><h1 id="lvTitle"></h1><div class="pill" id="moveCount"></div></header>
  <div class="boardWrap"><div class="board" id="board"><div class="exit"></div><div class="exitLabel">🏁</div></div></div>
  <div class="hintText" id="hintText"></div>
  <div class="toolRow">
    <button class="toolBtn" id="btnHint">💡 ヒント</button>
    <button class="toolBtn" id="btnReset">🔄 やりなおす</button>
  </div>
</div></div>

<div class="overlay" id="winOverlay" hidden></div>

<script>
(function(){
'use strict';
var LEVELS = [{"min":3,"v":[[2,2,2,0],[3,4,2,1],[4,0,2,1],[4,2,2,1],[0,5,2,0],[5,1,2,1],[2,0,2,0]]},{"min":4,"v":[[0,2,2,0],[2,1,2,1],[5,0,2,1],[0,3,2,1],[2,4,2,0],[5,2,3,1],[4,3,2,1],[0,0,2,0],[0,1,2,0],[4,1,2,1]]},{"min":5,"v":[[2,2,2,0],[4,0,3,1],[3,3,2,1],[1,1,2,1],[2,0,2,1],[1,4,2,0],[1,5,3,0],[4,3,2,0]]},{"min":6,"v":[[0,2,2,0],[2,0,2,0],[2,2,2,1],[0,4,2,1],[3,3,3,1],[4,5,2,0],[4,2,3,1]]},{"min":7,"v":[[2,2,2,0],[2,3,2,0],[0,1,3,0],[3,4,2,1],[4,0,3,1],[4,4,2,0],[4,3,2,0]]},{"min":8,"v":[[0,2,2,0],[0,4,2,1],[2,0,3,0],[4,2,2,1],[2,1,3,1],[3,2,2,1],[1,5,2,0],[3,1,2,0],[3,4,2,1]]},{"min":9,"v":[[1,2,2,0],[4,4,2,0],[1,0,2,1],[1,4,2,0],[2,0,2,0],[0,2,2,1],[4,0,3,1],[5,1,2,1],[0,4,2,1],[3,2,2,1],[1,5,2,0]]},{"min":10,"v":[[2,2,2,0],[2,4,2,1],[1,1,2,1],[0,5,2,0],[0,0,2,0],[4,1,3,1],[1,3,2,0],[4,0,2,0],[4,4,2,0],[0,1,2,1]]},{"min":11,"v":[[0,2,2,0],[2,0,3,0],[2,2,3,1],[3,3,2,1],[0,4,2,1],[4,4,2,0],[4,1,3,1]]},{"min":12,"v":[[2,2,2,0],[1,0,3,1],[3,4,3,0],[0,3,2,0],[4,1,3,1],[2,3,2,1]]},{"min":13,"v":[[1,2,2,0],[2,5,2,0],[1,0,3,0],[1,3,2,1],[5,1,3,1],[3,1,3,1],[4,1,3,1],[0,4,2,1],[2,4,2,0]]},{"min":14,"v":[[0,2,2,0],[1,4,2,1],[3,1,2,1],[2,4,2,0],[4,0,3,1],[2,2,2,1],[4,5,2,0],[1,0,3,0]]},{"min":15,"v":[[2,2,2,0],[0,4,2,0],[2,0,2,1],[4,0,2,0],[1,3,3,0],[1,1,2,1],[4,2,2,1],[2,4,3,0],[0,5,3,0],[5,3,3,1]]},{"min":16,"v":[[0,2,2,0],[4,3,2,1],[3,0,2,0],[1,4,3,0],[1,5,3,0],[1,0,2,1],[2,0,3,1],[5,2,2,1],[0,3,2,1],[3,1,2,1],[4,1,2,0]]},{"min":17,"v":[[0,2,2,0],[1,0,2,0],[3,1,3,1],[4,0,2,0],[2,1,2,1],[0,3,2,1],[1,3,2,0],[0,0,2,1],[0,5,2,0],[5,3,3,1],[3,4,2,0]]},{"min":19,"v":[[0,2,2,0],[1,0,2,0],[0,5,3,0],[4,0,2,1],[2,4,3,0],[0,0,2,1],[2,3,2,0],[5,1,2,1],[1,3,2,1],[2,1,2,1],[4,2,2,1]]},{"min":21,"v":[[2,2,2,0],[4,4,2,0],[4,2,2,1],[3,4,2,1],[0,1,2,1],[1,1,2,0],[3,1,2,0],[1,2,3,1],[4,5,2,0],[2,0,2,0],[0,5,2,0],[5,0,3,1],[2,4,2,1]]},{"min":25,"v":[[1,2,2,0],[2,3,2,1],[3,0,2,1],[5,1,2,1],[4,2,2,1],[0,0,2,0],[3,4,2,0],[4,0,2,1],[0,1,3,0],[0,2,2,1],[2,5,2,0],[3,2,2,1]]}];
var TIERS = [['かんたん',0,6],['ふつう',6,12],['むずかしい',12,18]];
var COLORS = [['#5aa8ff','#2f78d6'],['#6bd27a','#3a9f4c'],['#ffd23f','#e0a800'],['#b489ff','#7d4fd6'],['#ff9f4a','#e06a12'],['#4dd0c4','#1f9c90'],['#c49a6c','#8d6238'],['#ff7a8a','#d03a52'],['#9aa7b8','#6a7a90']];
var SAVE_KEY = 'blockescape_stars';

function loadStars(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'); }catch(e){ return {}; } }
function saveStar(i,n){ var s=loadStars(); if(!s[i]||s[i]<n){ s[i]=n; try{ localStorage.setItem(SAVE_KEY,JSON.stringify(s)); }catch(e){} } }

/* ---------- 音 ---------- */
var ac=null;
function tone(f,d,delay){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); var t=ac.currentTime+(delay||0); var o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d+0.03);}catch(e){} }

/* ---------- 盤面ロジック ---------- */
// vehicle: {x,y,len,dir} dir 0=よこ 1=たて ; index 0 = おうじょさまの くるま
var vehicles=[], levelIdx=0, moves=0, busy=false;
function cloneV(v){ return v.map(function(a){ return {x:a[0],y:a[1],len:a[2],dir:a[3]}; }); }
function grid(vs){
  var g=[],i,k; for(i=0;i<36;i++) g.push(-1);
  vs.forEach(function(v,n){ for(k=0;k<v.len;k++){ var cx=v.dir?v.x:v.x+k, cy=v.dir?v.y+k:v.y; g[cy*6+cx]=n; } });
  return g;
}
function range(vs,i){ // うごける はんい(いち の さいしょう/さいだい)
  var g=grid(vs), v=vs[i], pos=v.dir?v.y:v.x, lo=pos, hi=pos;
  function cell(p){ return v.dir? g[p*6+v.x] : g[v.y*6+p]; }
  while(lo-1>=0 && cell(lo-1)===-1) lo--;
  while(hi+v.len<=5 && cell(hi+v.len)===-1) hi++;
  return [lo,hi];
}
/* ヒント用 さいたん探索 (BFS) */
function solveFrom(vs){
  var start=vs.map(function(v){ return v.dir?v.y:v.x; });
  var key=function(S){ return S.join(','); };
  var seen={}; seen[key(start)]=null; var q=[start], guard=0;
  function build(S){ return vs.map(function(v,i){ return {x:v.dir?v.x:S[i], y:v.dir?S[i]:v.y, len:v.len, dir:v.dir}; }); }
  while(q.length && guard++<400000){
    var nq=[];
    for(var a=0;a<q.length;a++){
      var S=q[a];
      if(S[0]===4){ // 復元
        var path=[], k=key(S);
        while(seen[k]){ var prev=seen[k]; path.push(k); k=prev.k; }
        var lastK=path[path.length-1]; if(!lastK) return null;
        var first=seen[lastK]; return { veh:first.i, to:first.to };
      }
      var b=build(S);
      for(var i=0;i<vs.length;i++){
        var r=range(b,i), cur=S[i];
        for(var p=r[0];p<=r[1];p++){
          if(p===cur) continue;
          var T=S.slice(); T[i]=p; var kk=key(T);
          if(!(kk in seen)){ seen[kk]={k:key(S),i:i,to:p}; nq.push(T); }
        }
      }
    }
    q=nq;
  }
  return null;
}

/* ---------- 画面 ---------- */
var boardEl;
function showScreen(id){ ['screenSelect','screenPlay'].forEach(function(s){ document.getElementById(s).style.display=(s===id)?'block':'none'; }); window.scrollTo(0,0); }

function renderSelect(){
  var stars=loadStars(), h='';
  TIERS.forEach(function(t){
    h+='<div class="tier">'+t[0]+'</div><div class="levels">';
    for(var i=t[1];i<t[2];i++){
      var n=stars[i]||0;
      h+='<button class="lv" data-i="'+i+'">'+(i+1)+'<small>'+(n?'★★★'.slice(0,n):'')+'</small></button>';
    }
    h+='</div>';
  });
  var box=document.getElementById('levelsBox'); box.innerHTML=h;
  box.querySelectorAll('.lv').forEach(function(b){ b.addEventListener('click',function(){ startLevel(parseInt(b.getAttribute('data-i'),10)); }); });
}

function vehColor(i){ return i===0 ? ['#ff8fc7','#e0559f'] : COLORS[(i-1)%COLORS.length]; }
function buildVehEl(i){
  var v=vehicles[i], el=document.createElement('div');
  el.className='veh '+(v.dir?'v':'h')+(i===0?' target':'');
  el.style.setProperty('--w', v.dir?1:v.len); el.style.setProperty('--h', v.dir?v.len:1);
  var c=vehColor(i); el.style.setProperty('--c1',c[0]); el.style.setProperty('--c2',c[1]);
  var inner='<div class="body">';
  if(v.dir){ inner+='<div class="win" style="top:14%"></div>'; if(v.len===3) inner+='<div class="win" style="top:44%"></div>'; inner+='<div class="win" style="top:'+(v.len===3?'74%':'62%')+'"></div>'; inner+='<div class="lamp" style="left:14%;top:4px"></div><div class="lamp" style="right:14%;top:4px"></div>'; }
  else { inner+='<div class="win" style="left:'+(v.len===3?'14%':'16%')+'"></div>'; if(v.len===3) inner+='<div class="win" style="left:44%"></div>'; inner+='<div class="win" style="left:'+(v.len===3?'74%':'62%')+'"></div>'; inner+='<div class="lamp" style="right:4px;top:14%"></div><div class="lamp" style="right:4px;bottom:14%"></div>'; }
  if(i===0) inner+='<div class="crown">👑</div>';
  inner+='</div>';
  el.innerHTML=inner;
  attachDrag(el,i);
  return el;
}
function place(el,v){ el.style.left=(v.x*100/6)+'%'; el.style.top=(v.y*100/6)+'%'; }

function startLevel(i){
  levelIdx=i; moves=0; busy=false;
  vehicles=cloneV(LEVELS[i].v);
  boardEl=document.getElementById('board');
  Array.prototype.slice.call(boardEl.querySelectorAll('.veh')).forEach(function(e){ e.remove(); });
  vehicles.forEach(function(v,n){ var el=buildVehEl(n); place(el,v); el.setAttribute('data-i',n); boardEl.appendChild(el); });
  document.getElementById('lvTitle').textContent='ステージ '+(i+1);
  updateMoves(); document.getElementById('hintText').textContent='';
  document.getElementById('winOverlay').hidden=true;
  showScreen('screenPlay');
}
function updateMoves(){ document.getElementById('moveCount').textContent='うごかした '+moves+' かい'; }

function attachDrag(el,i){
  var startPt=null, startPos=0, rg=null, cellPx=0, curPos=0;
  el.addEventListener('pointerdown',function(e){
    if(busy) return;
    var v=vehicles[i]; rg=range(vehicles,i); startPos=v.dir?v.y:v.x; curPos=startPos;
    cellPx=boardEl.getBoundingClientRect().width/6;
    startPt={x:e.clientX,y:e.clientY};
    el.classList.add('dragging'); el.classList.remove('hint');
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  el.addEventListener('pointermove',function(e){
    if(!startPt) return;
    var v=vehicles[i], d=(v.dir? e.clientY-startPt.y : e.clientX-startPt.x)/cellPx;
    curPos=Math.max(rg[0],Math.min(rg[1],startPos+d));
    if(v.dir) el.style.top=(curPos*100/6)+'%'; else el.style.left=(curPos*100/6)+'%';
  });
  function end(){
    if(!startPt) return;
    startPt=null; el.classList.remove('dragging');
    var v=vehicles[i], snap=Math.round(curPos);
    if(snap!==startPos){
      if(v.dir) v.y=snap; else v.x=snap;
      moves++; updateMoves(); tone(520+Math.random()*80,0.08);
    }
    place(el,v);
    if(vehicles[0].x===4) win();
  }
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
}

function win(){
  busy=true;
  var el=boardEl.querySelector('.veh.target');
  el.classList.add('out'); el.style.left=(7*100/6)+'%';
  [523,659,784,1046].forEach(function(f,k){ tone(f,0.28,0.15*k); });
  var min=LEVELS[levelIdx].min, n = moves<=min?3 : (moves<=Math.ceil(min*1.6)?2:1);
  saveStar(levelIdx,n);
  setTimeout(function(){
    var ov=document.getElementById('winOverlay');
    var hasNext = levelIdx<LEVELS.length-1;
    ov.innerHTML='<div style="font-size:54px">🎉</div><div class="ovBig">でぐちに ついたよ！</div>'
      +'<div class="ovStars">'+'⭐'.repeat(n)+'<span style="opacity:.25">'+'⭐'.repeat(3-n)+'</span></div>'
      +'<div class="ovSub">'+moves+' かいで クリア！ '+(n===3?'ぴったり さいたん！すごい！':'(さいたんは '+min+' かい)')+'</div>'
      +(hasNext?'<button class="bigBtn" id="ovNext">つぎのステージ ▶</button>':'<div class="ovBig">ぜんぶ クリア！おめでとう👑</div>')
      +'<button class="bigBtn sec" id="ovAgain">もういちど</button><button class="bigBtn sec" id="ovList">ステージえらび</button>';
    ov.hidden=false;
    if(hasNext) document.getElementById('ovNext').addEventListener('click',function(){ startLevel(levelIdx+1); });
    document.getElementById('ovAgain').addEventListener('click',function(){ startLevel(levelIdx); });
    document.getElementById('ovList').addEventListener('click',function(){ ov.hidden=true; renderSelect(); showScreen('screenSelect'); });
  },1100);
}

function doHint(){
  if(busy) return;
  var h=solveFrom(vehicles), t=document.getElementById('hintText');
  if(!h){ t.textContent='むずかしいね… 「やりなおす」も つかってみてね'; return; }
  var v=vehicles[h.veh], cur=v.dir?v.y:v.x, arrow=v.dir?(h.to>cur?'⬇️':'⬆️'):(h.to>cur?'➡️':'⬅️');
  var el=boardEl.querySelector('.veh[data-i="'+h.veh+'"]');
  el.classList.remove('hint'); void el.offsetWidth; el.classList.add('hint');
  t.textContent='💡 ひかっている くるまを '+arrow+' に うごかしてみよう';
}

function init(){
  document.getElementById('btnBack').addEventListener('click',function(){ renderSelect(); showScreen('screenSelect'); });
  document.getElementById('btnReset').addEventListener('click',function(){ if(!busy) startLevel(levelIdx); });
  document.getElementById('btnHint').addEventListener('click',doHint);
  renderSelect(); showScreen('screenSelect');
}
document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body>
</html>
