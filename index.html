<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>プリンセスのゲームひろば</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "Hiragino Maru Gothic ProN","Rounded Mplus 1c","Segoe UI",sans-serif;
    background:
      radial-gradient(circle at 10% 10%, rgba(255,255,255,0.6) 0 6px, transparent 7px),
      radial-gradient(circle at 80% 20%, rgba(255,255,255,0.6) 0 5px, transparent 6px),
      radial-gradient(circle at 30% 80%, rgba(255,255,255,0.5) 0 4px, transparent 5px),
      radial-gradient(circle at 90% 70%, rgba(255,255,255,0.5) 0 5px, transparent 6px),
      radial-gradient(circle at 60% 40%, rgba(255,255,255,0.5) 0 4px, transparent 5px),
      linear-gradient(160deg, #ffe1f0 0%, #f4c9ff 45%, #c7e0ff 100%);
    background-attachment: fixed;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { max-width: 720px; width: 100%; padding: 24px 16px 40px; text-align: center; }
  h1 {
    font-size: 26px; margin: 0 0 28px; color: #8e2a6b;
    text-shadow: 0 1px 0 #fff; letter-spacing: 1px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
  }
  a.card {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #fffdf9; border-radius: 28px; text-decoration: none;
    padding: 28px 12px 20px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.16);
    transition: transform .15s ease;
  }
  a.card:active { transform: scale(0.94); }
  .emoji { font-size: 76px; line-height: 1; }
  .label { margin-top: 12px; font-size: 16px; color: #a4508b; font-weight: bold; }
</style>
</head>
<body>
<div class="wrap">
  <h1>✨ ゲームを えらんでね ✨</h1>
  <div class="grid">
    <a class="card" href="games/maze-and-teach/index.html">
      <div class="emoji">🤖</div>
      <div class="label">ぽことあそぶ</div>
    </a>
    <a class="card" href="games/coloring/index.html">
      <div class="emoji">🎨</div>
      <div class="label">プリンセスぬりえ</div>
    </a>
    <a class="card" href="games/programming-dojo/index.html">
      <div class="emoji">🥋</div>
      <div class="label">気功道場</div>
    </a>
    <a class="card" href="games/tangram/index.html">
      <div class="emoji">🧩</div>
      <div class="label">かたちパズル</div>
    </a>
    <a class="card" href="games/machigai/index.html">
      <div class="emoji">🔍</div>
      <div class="label">まちがいさがし</div>
    </a>
    <a class="card" href="games/album/index.html">
      <div class="emoji">🖼️</div>
      <div class="label">おもいでアルバム</div>
    </a>
    <a class="card" href="games/drive/index.html">
      <div class="emoji">🏎️</div>
      <div class="label">ドライブゲーム</div>
    </a>
  </div>
</div>
</body>
</html>
