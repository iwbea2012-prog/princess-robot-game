<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>プリンセスとロボットの AIプログラミングひろば</title>
<style>
  :root{
    --pink:#ff8fc7;
    --pink-dark:#ff5fae;
    --gold:#ffd76a;
    --blue:#8fd6ff;
    --blue-dark:#4fb8f0;
    --purple:#c9a8ff;
    --bg:#fff3fa;
    --ink:#5b3a52;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family: "Hiragino Maru Gothic ProN","Rounded Mplus 1c","Yu Gothic", sans-serif;
    background: radial-gradient(circle at 20% 10%, #fff8ff 0%, var(--bg) 40%, #ffe6f4 100%);
    color: var(--ink);
    overflow: hidden;
    touch-action: manipulation;
  }
  #app{
    width:100%; height:100%;
    position:relative;
    display:flex; flex-direction:column;
  }
  .view{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    padding: env(safe-area-inset-top,20px) 20px 20px 20px;
    overflow-y:auto;
  }
  .view.active{ display:flex; }

  h1.title{
    font-size: clamp(20px,5vw,34px);
    margin: 6px 0 2px 0;
    color: var(--pink-dark);
    text-shadow: 2px 2px 0 #fff, 0 0 10px #ffd0ea;
    text-align:center;
  }
  .subtitle{
    font-size: clamp(14px,3vw,18px);
    color:#a5638c;
    margin-bottom: 10px;
    text-align:center;
  }

  .char{
    font-size: 92px;
    line-height:1;
    filter: drop-shadow(0 6px 8px rgba(255,120,180,.35));
    animation: bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0) rotate(-2deg); }
    50%{ transform: translateY(-10px) rotate(2deg); }
  }

  .speech-bubble{
    background:#fff;
    border: 4px solid var(--pink);
    border-radius: 24px;
    padding: 14px 18px;
    max-width: 480px;
    width: 92%;
    font-size: clamp(15px,3.6vw,19px);
    text-align:center;
    box-shadow: 0 6px 0 rgba(255,150,200,.4);
    margin: 8px auto 14px auto;
    position:relative;
    font-weight:700;
  }

  .menu-row{
    display:flex; flex-wrap:wrap; gap:16px; justify-content:center;
    margin-top: 10px;
    width:100%;
    max-width: 560px;
  }
  .big-btn{
    flex: 1 1 210px;
    min-height: 130px;
    border-radius: 28px;
    border: none;
    background: linear-gradient(160deg, #fff, #ffeaf6);
    box-shadow: 0 8px 0 var(--pink-dark), 0 12px 18px rgba(255,100,170,.25);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 6px;
    font-size: 17px;
    font-weight: 800;
    color: var(--pink-dark);
    padding: 10px;
    cursor:pointer;
    transition: transform .08s;
  }
  .big-btn .emoji{ font-size: 46px; }
  .big-btn:active{ transform: translateY(6px); box-shadow: 0 2px 0 var(--pink-dark); }
  .big-btn.blue{ box-shadow: 0 8px 0 var(--blue-dark), 0 12px 18px rgba(90,180,240,.25); color:#2c7fab; }
  .big-btn.blue:active{ box-shadow: 0 2px 0 var(--blue-dark); }

  .top-bar{
    width:100%; max-width: 640px;
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 6px;
  }
  .icon-btn{
    width:56px; height:56px; border-radius:50%;
    border:none;
    background:#fff;
    box-shadow: 0 5px 0 rgba(0,0,0,.12);
    font-size: 26px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn:active{ transform: translateY(4px); box-shadow:none; }

  .level-badge{
    background:#fff;
    border-radius: 16px;
    padding: 6px 14px;
    font-weight:800;
    font-size: 14px;
    color: var(--pink-dark);
    box-shadow: 0 4px 0 #ffd0ea;
    white-space:nowrap;
  }

  /* ---- Game 1: sequence maze ---- */
  .grid-wrap{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    width:100%;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(4, 60px);
    grid-template-rows: repeat(4, 60px);
    gap:6px;
    background: #ffd9ee;
    padding: 10px;
    border-radius: 20px;
    box-shadow: inset 0 0 0 4px #fff;
  }
  .cell{
    background:#fff;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size: 28px;
    position:relative;
  }
  .cell.wall{ background:#e3b6cf; }
  .cell.goal{ background:#fff6c9; }
  .cell .who{ position:absolute; font-size:32px; transition: all .35s ease; }

  .block-tray{
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    margin: 10px 0;
  }
  .arrow-btn{
    width:60px; height:60px; border-radius:18px;
    border:none;
    font-size: 28px;
    background: linear-gradient(160deg,#fff,#e9f6ff);
    box-shadow: 0 6px 0 var(--blue-dark);
    cursor:pointer;
  }
  .arrow-btn:active{ transform: translateY(5px); box-shadow:none; }
  .arrow-btn:disabled{ opacity:.5; }

  .program-strip{
    display:flex; gap:6px; flex-wrap:wrap; justify-content:center;
    min-height: 50px;
    background:#fff;
    border-radius:16px;
    padding: 8px;
    width: 92%;
    max-width: 480px;
    align-items:center;
    box-shadow: inset 0 0 0 3px #ffd9ee;
  }
  .program-strip .step{
    width:38px; height:38px; border-radius:10px;
    background: var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
  }
  .program-strip .step.running{ background: var(--pink); animation:pulse .4s; }
  @keyframes pulse{ 0%{transform:scale(1.3)} 100%{transform:scale(1)} }

  .ctrl-row{ display:flex; gap:14px; margin-top:10px; }
  .action-btn{
    padding: 12px 22px;
    border-radius: 20px;
    border:none;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    color:#fff;
  }
  .action-btn.go{ background: linear-gradient(160deg,#7fe0a0,#3fbf6e); box-shadow: 0 6px 0 #2a9450; }
  .action-btn.clear{ background: linear-gradient(160deg,#ffb0b0,#ff7a7a); box-shadow: 0 6px 0 #d84a4a; }
  .action-btn:active{ transform: translateY(5px); box-shadow:none; }
  .action-btn:disabled{ opacity:.5; }

  /* ---- Game 2: sorting ---- */
  .sort-area{
    display:flex; gap:14px; width:100%; max-width:520px; justify-content:center; margin-top:6px;
  }
  .basket{
    flex:1;
    min-height: 120px;
    background:#fff;
    border-radius: 22px;
    border: 4px dashed var(--pink);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding: 10px;
    gap:6px;
    cursor:pointer;
  }
  .basket .label{ font-weight:800; color:var(--pink-dark); font-size:15px; text-align:center; }
  .basket .items{ display:flex; flex-wrap:wrap; gap:2px; justify-content:center; }
  .basket .items span{ font-size:16px; }

  .item-card{
    font-size: 54px;
    background:#fff;
    border-radius:18px;
    width:96px; height:96px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 0 #e9b8d3;
    margin: 12px auto;
  }

  .progress-wrap{
    width: 92%; max-width: 420px;
    margin-top: 10px;
    text-align:center;
  }
  .progress-track{
    background:#ffe3f2;
    border-radius: 10px;
    height: 14px;
    overflow:hidden;
    box-shadow: inset 0 0 0 2px #fff;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--pink), var(--pink-dark));
    border-radius: 10px;
    transition: width .3s ease;
    width:0%;
  }
  .progress-count{
    font-size:13px; font-weight:800; color:#a5638c; margin-top:4px;
  }

  .confetti-layer{
    position:fixed; inset:0; pointer-events:none; z-index:50; overflow:hidden;
  }
  .confetti-piece{
    position:absolute; top:-20px; font-size:26px;
    animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(360deg); opacity:.9; }
  }

  .top-controls{
    position:fixed; top:10px; right:10px; z-index:60;
    display:flex; gap:8px; align-items:center;
  }
  .lang-switch{
    display:flex;
    background:#fff;
    border-radius: 20px;
    box-shadow: 0 4px 0 rgba(0,0,0,.12);
    overflow:hidden;
  }
  .lang-switch button{
    border:none;
    background:transparent;
    padding: 8px 12px;
    font-size: 13px;
    font-weight:800;
    color:#a5638c;
    cursor:pointer;
  }
  .lang-switch button.active{
    background: var(--pink);
    color:#fff;
  }
</style>
</head>
<body>
<div id="app">

  <div class="top-controls">
    <div class="lang-switch">
      <button id="btnLangJa" onclick="setLang('ja')">日本語</button>
      <button id="btnLangEn" onclick="setLang('en')">English</button>
    </div>
    <button class="icon-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
  </div>

  <!-- HOME -->
  <div class="view active" id="view-home">
    <h1 class="title" id="titleText"></h1>
    <div class="subtitle" id="subtitleText"></div>
    <div class="char" id="homeChar">👸</div>
    <div class="speech-bubble" id="homeBubble"></div>
    <div class="menu-row">
      <button class="big-btn" onclick="startGame1()">
        <div class="emoji">🧭</div>
        <span id="menuBtn1Label"></span>
      </button>
      <button class="big-btn blue" onclick="startGame2()">
        <div class="emoji">🤖</div>
        <span id="menuBtn2Label"></span>
      </button>
    </div>
  </div>

  <!-- GAME 1: sequence maze -->
  <div class="view" id="view-game1">
    <div class="top-bar">
      <button class="icon-btn" onclick="goHome()">🏠</button>
      <div class="subtitle" style="margin:0;" id="g1Subtitle"></div>
      <div class="level-badge" id="g1LevelBadge"></div>
    </div>
    <div class="speech-bubble" id="g1Bubble"></div>

    <div class="grid-wrap">
      <div class="grid" id="grid"></div>

      <div class="program-strip" id="programStrip"></div>

      <div class="block-tray">
        <button class="arrow-btn" onclick="addStep('up')">⬆️</button>
        <button class="arrow-btn" onclick="addStep('down')">⬇️</button>
        <button class="arrow-btn" onclick="addStep('left')">⬅️</button>
        <button class="arrow-btn" onclick="addStep('right')">➡️</button>
      </div>

      <div class="ctrl-row">
        <button class="action-btn clear" id="g1ClearBtn" onclick="clearProgram()"></button>
        <button class="action-btn go" id="g1GoBtn" onclick="runProgram()"></button>
      </div>
    </div>
  </div>

  <!-- GAME 2: AI sorting -->
  <div class="view" id="view-game2">
    <div class="top-bar">
      <button class="icon-btn" onclick="goHome()">🏠</button>
      <div class="subtitle" style="margin:0;" id="g2Subtitle"></div>
      <div style="width:56px;"></div>
    </div>
    <div class="speech-bubble" id="g2Bubble"></div>

    <div class="item-card" id="currentItem">🐶</div>

    <div class="sort-area">
      <div class="basket" id="basketAnimal">
        <div class="label" id="basketAnimalLabel"></div>
        <div class="items" id="itemsAnimal"></div>
      </div>
      <div class="basket" id="basketVehicle">
        <div class="label" id="basketVehicleLabel"></div>
        <div class="items" id="itemsVehicle"></div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="g2ProgressFill"></div></div>
      <div class="progress-count" id="g2ProgressCount"></div>
    </div>
  </div>

</div>

<script>
/* ================= Translations ================= */
const T = {
  ja: {
    title: '✨ プリンセスと ロボットの ひろば ✨',
    subtitle: 'AIと プログラミングで あそぼう！',
    homeGreeting: 'こんにちは！ わたしは プリンセス。 こっちは ロボットの ぽこよ。 いっしょに あそびましょう！',
    homeBubble: 'こんにちは！ わたしと ロボットの ぽこ と いっしょに あそぼう！',
    menu1: 'じゅんばん めいろ',
    menu2: 'ロボットに おしえよう',
    goHomeSpeak: 'また あそぼうね！',
    level: 'レベル',
    g1Subtitle: '👸 を おしろまで うごかそう',
    g1Intro: 'やじるしを タップして じゅんばんを つくってね！',
    g1Clear: '🔄 やりなおし',
    g1Go: '▶️ スタート！',
    g1ClearSpeak: 'もういちど つくってみよう！',
    g1StartSpeak: 'スタート！',
    g1WallHit: 'あら！ かべに ぶつかっちゃった。 もういちど！',
    g1Miss: 'おしいね！ もういちど やってみよう。',
    g1Success: 'やったね！ おしろに とうちゃく！ 🎉',
    g1NextSpeak: 'つぎの レベルに いくよ！',
    g1AllDone: 'ぜんぶの 20レベル クリアしたね！ すごい！ 🎉',
    dirs: { up:'うえ', down:'した', left:'ひだり', right:'みぎ' },
    g2Subtitle: 'どうぶつ？ のりもの？',
    g2Intro: 'ぽこは まだ どうぶつと のりものが よく わからないの。 おしえてくれる？',
    g2Item: 'これは どっちかな？ タップして えらんでね。',
    g2Correct: 'せいかい！ すごい！',
    g2Incorrect: 'おしい！ でも だいじょうぶ、 いっしょに おぼえよう。',
    g2AllDone: 'ぜんぶの 20もん おしえてくれて ありがとう！ ぽこは かしこくなったよ 🎉',
    basketAnimal: '🐾 どうぶつ',
    basketVehicle: '🚗 のりもの',
    langSwitchSpeak: 'にほんごに したよ'
  },
  en: {
    title: '✨ Princess & Robot Playground ✨',
    subtitle: "Let's play with AI and Programming!",
    homeGreeting: "Hi! I'm the Princess, and this is Poko the robot. Let's play together!",
    homeBubble: "Hi! Let's play together with me and Poko the robot!",
    menu1: 'Sequence Maze',
    menu2: 'Teach the Robot',
    goHomeSpeak: "Let's play again soon!",
    level: 'Level',
    g1Subtitle: 'Move the princess to the castle',
    g1Intro: 'Tap the arrows to build the sequence!',
    g1Clear: '🔄 Retry',
    g1Go: '▶️ Start!',
    g1ClearSpeak: "Let's build it again!",
    g1StartSpeak: 'Start!',
    g1WallHit: 'Oops! You hit a wall. Try again!',
    g1Miss: 'So close! Try again.',
    g1Success: 'Yay! You reached the castle! 🎉',
    g1NextSpeak: 'On to the next level!',
    g1AllDone: 'You cleared all 20 levels! Amazing! 🎉',
    dirs: { up:'up', down:'down', left:'left', right:'right' },
    g2Subtitle: 'Animal or Vehicle?',
    g2Intro: "Poko doesn't know animals from vehicles yet. Can you teach him?",
    g2Item: 'Which one is this? Tap to choose!',
    g2Correct: 'Correct! Great job!',
    g2Incorrect: "Not quite! That's okay, let's learn together.",
    g2AllDone: 'Thank you for teaching me all 20! Poko got smarter! 🎉',
    basketAnimal: '🐾 Animals',
    basketVehicle: '🚗 Vehicles',
    langSwitchSpeak: 'Switched to English!'
  }
};
let lang = 'ja';

/* ---------------- Speech ---------------- */
let muted = false;
let jaVoice = null, enVoice = null;
function loadVoices(){
  const voices = speechSynthesis.getVoices();
  jaVoice = voices.find(v => v.lang && v.lang.startsWith('ja')) || null;
  enVoice = voices.find(v => v.lang && v.lang.startsWith('en')) || null;
}
try{
  if ('speechSynthesis' in window){
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }
}catch(e){}

function speak(text){
  if (muted) return;
  if (!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (lang === 'en'){
      u.lang = 'en-US';
      if (enVoice) u.voice = enVoice;
    } else {
      u.lang = 'ja-JP';
      if (jaVoice) u.voice = jaVoice;
    }
    u.rate = 0.95;
    u.pitch = 1.15;
    speechSynthesis.speak(u);
  }catch(e){}
}
function toggleMute(){
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
  if (muted && 'speechSynthesis' in window){
    try{ speechSynthesis.cancel(); }catch(e){}
  }
}

/* ---------------- Language ---------------- */
function setLang(next){
  lang = next;
  document.getElementById('btnLangJa').classList.toggle('active', lang==='ja');
  document.getElementById('btnLangEn').classList.toggle('active', lang==='en');
  applyStaticText();
  speak(T[lang].langSwitchSpeak);
}
function applyStaticText(){
  const S = T[lang];
  document.getElementById('titleText').textContent = S.title;
  document.getElementById('subtitleText').textContent = S.subtitle;
  document.getElementById('homeBubble').textContent = S.homeBubble;
  document.getElementById('menuBtn1Label').textContent = S.menu1;
  document.getElementById('menuBtn2Label').textContent = S.menu2;

  document.getElementById('g1Subtitle').textContent = S.g1Subtitle;
  document.getElementById('g1ClearBtn').textContent = S.g1Clear;
  document.getElementById('g1GoBtn').textContent = S.g1Go;
  updateLevelBadge();
  if (document.getElementById('view-game1').classList.contains('active') && !running){
    document.getElementById('g1Bubble').textContent = S.g1Intro;
  }

  document.getElementById('g2Subtitle').textContent = S.g2Subtitle;
  document.getElementById('basketAnimalLabel').textContent = S.basketAnimal;
  document.getElementById('basketVehicleLabel').textContent = S.basketVehicle;
  if (document.getElementById('view-game2').classList.contains('active')){
    document.getElementById('g2Bubble').textContent = S.g2Item;
  }
}

/* ---------------- Nav ---------------- */
function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome(){
  showView('view-home');
  speak(T[lang].goHomeSpeak);
}

window.addEventListener('load', () => {
  applyStaticText();
  document.getElementById('btnLangJa').classList.add('active');
  setTimeout(() => { speak(T[lang].homeGreeting); }, 400);
});

/* ---------------- Game 1: sequence maze (20 levels) ---------------- */
const SIZE = 4;
const TOTAL_LEVELS = 20;
const CORNERS = [{r:0,c:0},{r:0,c:3},{r:3,c:0},{r:3,c:3}];

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function bfsReachable(start, goal, walls, size){
  const key = (r,c)=>r+'_'+c;
  const wallSet = new Set(walls.map(w=>key(w.r,w.c)));
  const visited = new Set([key(start.r,start.c)]);
  const queue = [start];
  while(queue.length){
    const cur = queue.shift();
    if (cur.r===goal.r && cur.c===goal.c) return true;
    const neighbors = [{r:cur.r-1,c:cur.c},{r:cur.r+1,c:cur.c},{r:cur.r,c:cur.c-1},{r:cur.r,c:cur.c+1}];
    for (const n of neighbors){
      if (n.r<0||n.r>=size||n.c<0||n.c>=size) continue;
      if (wallSet.has(key(n.r,n.c))) continue;
      const k = key(n.r,n.c);
      if (visited.has(k)) continue;
      visited.add(k);
      queue.push(n);
    }
  }
  return false;
}
function buildLevels(){
  const levels = [];
  for (let i=0;i<TOTAL_LEVELS;i++){
    const start = CORNERS[i % 4];
    const goal = CORNERS[(i+2) % 4];
    const wallCount = Math.min(4, Math.floor(i/4));
    let walls = [];
    let attempts = 0;
    let ok = false;
    while (attempts < 30 && !ok){
      const rnd = mulberry32(1000 + i*97 + attempts*13);
      walls = [];
      const used = new Set([start.r+'_'+start.c, goal.r+'_'+goal.c]);
      let tries = 0;
      while (walls.length < wallCount && tries < 60){
        tries++;
        const r = Math.floor(rnd()*SIZE);
        const c = Math.floor(rnd()*SIZE);
        const k = r+'_'+c;
        if (used.has(k)) continue;
        walls.push({r,c});
        used.add(k);
      }
      ok = bfsReachable(start, goal, walls, SIZE);
      attempts++;
    }
    if (!ok) walls = [];
    levels.push({ start, goal, walls });
  }
  return levels;
}
const LEVELS = buildLevels();

let levelIndex = 0;
let startPos, goalPos, walls;
let pos;
let program = [];
let running = false;

function updateLevelBadge(){
  document.getElementById('g1LevelBadge').textContent = T[lang].level + ' ' + (levelIndex+1) + ' / ' + TOTAL_LEVELS;
}
function loadLevel(i){
  const lvl = LEVELS[i];
  startPos = {...lvl.start};
  goalPos = {...lvl.goal};
  walls = lvl.walls.map(w=>({...w}));
  pos = {...startPos};
  program = [];
  buildGrid();
  renderProgram();
  updateLevelBadge();
  setControlsEnabled(true);
}
function buildGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let r=0;r<SIZE;r++){
    for (let c=0;c<SIZE;c++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = 'cell-'+r+'-'+c;
      if (walls.some(w=>w.r===r&&w.c===c)) cell.classList.add('wall');
      if (r===goalPos.r && c===goalPos.c){
        cell.classList.add('goal');
        cell.innerHTML = '🏰';
      }
      grid.appendChild(cell);
    }
  }
  placeChar();
}
function placeChar(){
  document.querySelectorAll('.who').forEach(e=>e.remove());
  const cell = document.getElementById('cell-'+pos.r+'-'+pos.c);
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = '👸';
  cell.appendChild(who);
}
function startGame1(){
  levelIndex = 0;
  loadLevel(levelIndex);
  document.getElementById('g1Bubble').textContent = T[lang].g1Intro;
  showView('view-game1');
  speak(T[lang].g1Intro);
}
function setControlsEnabled(on){
  document.querySelectorAll('#view-game1 .arrow-btn, #g1GoBtn, #g1ClearBtn').forEach(b=>{ b.disabled = !on; });
}
function addStep(dir){
  if (running) return;
  if (program.length >= 8) return;
  program.push(dir);
  renderProgram();
  speak(T[lang].dirs[dir]);
}
function clearProgram(){
  if (running) return;
  program = [];
  pos = {...startPos};
  renderProgram();
  buildGrid();
  speak(T[lang].g1ClearSpeak);
}
function renderProgram(){
  const strip = document.getElementById('programStrip');
  strip.innerHTML = '';
  const arrow = {up:'⬆️',down:'⬇️',left:'⬅️',right:'➡️'};
  program.forEach((p,i)=>{
    const s = document.createElement('div');
    s.className = 'step';
    s.id = 'step-'+i;
    s.textContent = arrow[p];
    strip.appendChild(s);
  });
}
function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }

async function runProgram(){
  if (running || program.length===0) return;
  running = true;
  setControlsEnabled(false);
  pos = {...startPos};
  buildGrid();
  document.getElementById('g1Bubble').textContent = T[lang].g1StartSpeak;
  speak(T[lang].g1StartSpeak);
  await sleep(500);
  let hitWall = false;
  for (let i=0;i<program.length;i++){
    const step = document.getElementById('step-'+i);
    if (step) step.classList.add('running');
    const dir = program[i];
    let np = {...pos};
    if (dir==='up') np.r -= 1;
    if (dir==='down') np.r += 1;
    if (dir==='left') np.c -= 1;
    if (dir==='right') np.c += 1;
    const inBounds = np.r>=0 && np.r<SIZE && np.c>=0 && np.c<SIZE;
    const hitsWall = walls.some(w=>w.r===np.r && w.c===np.c);
    if (inBounds && !hitsWall){
      pos = np;
      placeChar();
    } else {
      document.getElementById('g1Bubble').textContent = T[lang].g1WallHit;
      speak(T[lang].g1WallHit);
      hitWall = true;
      if (step) step.classList.remove('running');
      break;
    }
    await sleep(450);
    if (step) step.classList.remove('running');
  }
  running = false;
  setControlsEnabled(true);
  if (hitWall) return;

  if (pos.r===goalPos.r && pos.c===goalPos.c){
    document.getElementById('g1Bubble').textContent = T[lang].g1Success;
    speak(T[lang].g1Success);
    celebrate(false);
    if (levelIndex < TOTAL_LEVELS - 1){
      setControlsEnabled(false);
      await sleep(1700);
      levelIndex++;
      loadLevel(levelIndex);
      document.getElementById('g1Bubble').textContent = T[lang].g1Intro;
      speak(T[lang].g1NextSpeak);
    } else {
      document.getElementById('g1Bubble').textContent = T[lang].g1AllDone;
      speak(T[lang].g1AllDone);
      celebrate(true);
      setControlsEnabled(false);
    }
  } else {
    document.getElementById('g1Bubble').textContent = T[lang].g1Miss;
    speak(T[lang].g1Miss);
  }
}

/* ---------------- Game 2: AI sorting (20 items) ---------------- */
const ITEMS = [
  {emoji:'🐶', type:'animal'},
  {emoji:'🚗', type:'vehicle'},
  {emoji:'🐱', type:'animal'},
  {emoji:'🚂', type:'vehicle'},
  {emoji:'🐰', type:'animal'},
  {emoji:'🚲', type:'vehicle'},
  {emoji:'🐻', type:'animal'},
  {emoji:'🚌', type:'vehicle'},
  {emoji:'🐼', type:'animal'},
  {emoji:'🚀', type:'vehicle'},
  {emoji:'🦁', type:'animal'},
  {emoji:'⛵', type:'vehicle'},
  {emoji:'🐸', type:'animal'},
  {emoji:'🚁', type:'vehicle'},
  {emoji:'🐵', type:'animal'},
  {emoji:'🚕', type:'vehicle'},
  {emoji:'🐷', type:'animal'},
  {emoji:'🚓', type:'vehicle'},
  {emoji:'🐨', type:'animal'},
  {emoji:'✈️', type:'vehicle'},
];
let g2index = 0;

function startGame2(){
  g2index = 0;
  document.getElementById('itemsAnimal').innerHTML='';
  document.getElementById('itemsVehicle').innerHTML='';
  updateG2Progress();
  showNextItem();
  showView('view-game2');
  speak(T[lang].g2Intro);
  document.getElementById('g2Bubble').textContent = T[lang].g2Intro;
}
function updateG2Progress(){
  const pct = Math.round((g2index / ITEMS.length) * 100);
  document.getElementById('g2ProgressFill').style.width = pct + '%';
  document.getElementById('g2ProgressCount').textContent = g2index + ' / ' + ITEMS.length;
}
function showNextItem(){
  if (g2index >= ITEMS.length){
    document.getElementById('g2Bubble').textContent = T[lang].g2AllDone;
    speak(T[lang].g2AllDone);
    document.getElementById('currentItem').style.visibility = 'hidden';
    celebrate(true);
    return;
  }
  document.getElementById('currentItem').style.visibility = 'visible';
  const it = ITEMS[g2index];
  document.getElementById('currentItem').textContent = it.emoji;
  document.getElementById('g2Bubble').textContent = T[lang].g2Item;
}
function chooseBasket(type){
  const it = ITEMS[g2index];
  if (!it) return;
  const correct = it.type === type;
  const listId = type==='animal' ? 'itemsAnimal' : 'itemsVehicle';
  const span = document.createElement('span');
  span.textContent = it.emoji;
  document.getElementById(listId).appendChild(span);

  if (correct){
    document.getElementById('g2Bubble').textContent = T[lang].g2Correct;
    speak(T[lang].g2Correct);
  } else {
    document.getElementById('g2Bubble').textContent = T[lang].g2Incorrect;
    speak(T[lang].g2Incorrect);
  }
  g2index++;
  updateG2Progress();
  setTimeout(showNextItem, 900);
}
document.getElementById('basketAnimal').addEventListener('click', ()=>chooseBasket('animal'));
document.getElementById('basketVehicle').addEventListener('click', ()=>chooseBasket('vehicle'));

/* ---------------- Celebration ---------------- */
function celebrate(big){
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  document.body.appendChild(layer);
  const emojis = ['🎉','✨','🌟','💖','👑','🎊'];
  const count = big ? 50 : 22;
  for (let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    p.style.left = Math.random()*100 + 'vw';
    p.style.animationDuration = (2 + Math.random()*1.5) + 's';
    p.style.fontSize = (18 + Math.random()*20) + 'px';
    layer.appendChild(p);
  }
  setTimeout(()=> layer.remove(), 3600);
}

loadLevel(0);
